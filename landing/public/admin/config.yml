# Decap CMS — quản trị blog Tuấn LA Lab (git-based: Save = commit vào repo -> auto deploy).
# Repo gốc = semantix-docs; dự án astro nằm trong landing/ nên đường dẫn tính TỪ GỐC REPO.
backend:
  name: github
  repo: tuanla90/semantix-docs
  branch: main
  base_url: https://semantix-docs-production.up.railway.app

# Cho phép test tại chỗ trước khi có OAuth:  cd landing && npx decap-server  (rồi mở /admin?local)
local_backend: true

# ảnh chèn trong thân bài (cover PNG sinh tự động, không quản ở đây)
media_folder: "landing/public/uploads"
public_folder: "/uploads"

# slug sạch ASCII (bỏ dấu tiếng Việt): "Một nguồn sự thật" -> mot-nguon-su-that
slug:
  encoding: "ascii"
  clean_accents: true

# editorial_workflow: mỗi bài đang sửa nằm ở NHÁNH riêng (cms/blog-<slug>) -> KHÔNG deploy.
# Kéo bài sang cột "Ready" rồi bấm "Publish" mới merge vào main = 1 deploy. Sửa/lưu bao nhiêu lần cũng không deploy.
publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "Bài Blog"
    label_singular: "Bài"
    description: "Sửa/tạo bài blog. Bấm Publish = commit vào repo, site tự build lại."
    folder: "landing/src/content/blog"
    create: true
    delete: false
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}  ·  {{pubDate}}  ·  {{category}}"
    # Sắp xếp: mặc định MỚI NHẤT trước; vẫn bấm sort theo tiêu đề/danh mục được
    sortable_fields:
      fields: [pubDate, title, category]
      default: { field: pubDate, direction: descending }
    # Nút lọc nhanh: Nổi bật + từng danh mục (pattern = regex, khớp tên danh mục)
    view_filters:
      - { label: "⭐ Nổi bật", field: featured, pattern: true }
      - { label: "Kiến Thức Nền Tảng", field: category, pattern: "Kiến Thức Nền Tảng" }
      - { label: "Phân Tích Dữ Liệu", field: category, pattern: "Phân Tích Dữ Liệu" }
      - { label: "Hướng Dẫn Thực Chiến", field: category, pattern: "Hướng Dẫn Thực Chiến" }
      - { label: "AI & Công Nghệ", field: category, pattern: "AI & Công Nghệ" }
      - { label: "So Sánh & Lựa Chọn", field: category, pattern: "So Sánh & Lựa Chọn" }
      - { label: "Câu Chuyện & Use Case", field: category, pattern: "Câu Chuyện & Use Case" }
    # Gom nhóm: theo chủ đề hoặc theo năm (\d{4} tách năm từ pubDate)
    view_groups:
      - { label: "Theo chủ đề", field: category }
      - { label: "Theo năm", field: pubDate, pattern: '\d{4}' }
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Mô tả (preview/SEO)", name: "description", widget: "text" }
      - { label: "Ngày đăng", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - label: "Chủ đề"
        name: "category"
        widget: "select"
        options:
          - "Kiến Thức Nền Tảng"
          - "Phân Tích Dữ Liệu"
          - "Hướng Dẫn Thực Chiến"
          - "AI & Công Nghệ"
          - "So Sánh & Lựa Chọn"
          - "Câu Chuyện & Use Case"
      - { label: "Thời gian đọc (phút)", name: "readTime", widget: "number", default: 7, value_type: "int", min: 1 }
      - { label: "Tác giả", name: "author", widget: "string", default: "Lê Anh Tuấn", required: false }
      - { label: "Chức danh tác giả", name: "authorTitle", widget: "string", default: "Nhà sáng lập Semantix", required: false }
      - { label: "Nổi bật (featured)", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Ảnh cover (đường dẫn)", name: "cover", widget: "string", required: false, hint: "vd /blog/covers/<slug>.png — cover thường sinh tự động, để trống nếu chưa có" }
      - { label: "Cover alt", name: "coverAlt", widget: "string", required: false }
      - { label: "Mã (code, nội bộ)", name: "code", widget: "string", required: false }
      - { label: "Series (nếu có)", name: "series", widget: "string", required: false }
      - { label: "Thứ tự trong series", name: "seriesOrder", widget: "number", required: false, value_type: "int" }
      - { label: "Nội dung", name: "body", widget: "markdown" }

  # ---- Script lời thoại video (script.json) — sửa bằng FORM, không vỡ cú pháp ----
  - name: "scripts"
    label: "Script Voice (video)"
    label_singular: "Script"
    description: "Sửa lời thoại video. Giữ [tag] cảm xúc đầu câu (vd [thoughtful]) + xuống dòng = nhịp ngắt. Không tạo mới ở đây (script sinh từ pipeline)."
    folder: "landing/video-remotion/videos"
    path: "{{slug}}/script"
    extension: "json"
    format: "json"
    create: false
    delete: false
    identifier_field: "slug"
    summary: "{{slug}}"
    # Sort theo slug (A→Z); Sveltia còn TỰ thêm sort theo ngày sửa (commit Git) trong UI
    sortable_fields:
      fields: [slug]
      default: { field: slug, direction: ascending }
    fields:
      - { label: "Video (slug)", name: "slug", widget: "string" }
      - label: "Các đoạn (beat) — lời thoại"
        name: "beats"
        widget: "list"
        fields:
          - { label: "ID beat", name: "id", widget: "string" }
          - { label: "Lời thoại", name: "text", widget: "text", hint: "Giữ [tag] cảm xúc đầu câu; mỗi lần xuống dòng = 1 nhịp ngắt nghỉ." }
      - { label: "Short outro (nếu có)", name: "shortOutro", widget: "text", required: false }
      - label: "Phát âm riêng (PRON) — tuỳ chọn"
        name: "pron"
        widget: "list"
        required: false
        fields:
          - { label: "Từ", name: "word", widget: "string" }
          - { label: "Đọc là", name: "say", widget: "string" }

  # ==== Docs GitBook (song ngữ) — Sveltia CHƯA đọc đệ quy nên tách 1 collection / thư mục ====
  # Body-only -> Markdown thuần (không frontmatter). media_folder rỗng -> ảnh cạnh file (GitBook render tương đối).
  # Tạo trang mới nhớ tự thêm link vào <lang>/SUMMARY.md (CMS không tự thêm).

  - name: "docs-vi-root"
    label: "VI · (Gốc)"
    files:
      - name: "readme"
        label: "README.md"
        file: "vi/README.md"
        media_folder: ""
        public_folder: ""
        fields: [{ label: "Nội dung (Markdown)", name: "body", widget: "markdown" }]
      - name: "about"
        label: "about.md"
        file: "vi/about.md"
        media_folder: ""
        public_folder: ""
        fields: [{ label: "Nội dung (Markdown)", name: "body", widget: "markdown" }]

