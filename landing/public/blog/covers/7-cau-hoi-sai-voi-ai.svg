<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bghd012" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrhd012" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bghd012)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="135" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="220" fill="#ffffff" font-size="52" font-weight="800">7 câu hỏi sai với AI</text>
  <text x="80" y="284" fill="#CBD5E1" font-size="28" font-weight="600">Hỏi mơ hồ &amp; hỏi lại cho đúng</text>
  <text x="80" y="528" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: vague question bubble (red ✗) → clear question (green ✓) -->
  <g transform="translate(720,180)">
    <!-- vague bubble -->
    <rect x="0" y="0" width="190" height="96" rx="16" fill="#1E293B" stroke="#F87171" stroke-width="2"/>
    <path d="M30 96 L30 124 L58 96 Z" fill="#1E293B" stroke="#F87171" stroke-width="2"/>
    <text x="22" y="40" fill="#94A3B8" font-size="22" font-weight="600">Doanh thu</text>
    <text x="22" y="72" fill="#94A3B8" font-size="22" font-weight="600">bao nhiêu?</text>
    <circle cx="166" cy="22" r="16" fill="#F87171"/>
    <path d="M159 15 L173 29 M173 15 L159 29" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <!-- arrow -->
    <path d="M210 70 L296 70" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arrhd012)"/>
    <!-- clear bubble -->
    <rect x="312" y="0" width="220" height="96" rx="16" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <path d="M504 96 L504 124 L476 96 Z" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="334" y="40" fill="#E2E8F0" font-size="20" font-weight="600">Doanh thu T6</text>
    <text x="334" y="70" fill="#E2E8F0" font-size="20" font-weight="600">so T5, theo ngày giao?</text>
    <circle cx="508" cy="22" r="16" fill="#4ADE80"/>
    <path d="M501 22 L506 28 L516 16" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
