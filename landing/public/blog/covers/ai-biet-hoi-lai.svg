<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg6)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">AI biết hỏi lại</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Làm rõ trước, trả số sau</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: AI returns a clarifying question before the number -->
  <g transform="translate(720,168)">
    <!-- user question -->
    <rect x="20" y="0" width="320" height="60" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="42" y="38" fill="#94A3B8" font-size="20">Doanh thu tháng này?</text>
    <!-- AI clarifying bubble (instead of an answer) -->
    <rect x="60" y="80" width="360" height="68" rx="16" fill="url(#acc6)"/>
    <text x="82" y="112" fill="#fff" font-size="19" font-weight="600">Kênh nào? Gồm hoàn/huỷ?</text>
    <text x="82" y="136" fill="#E0E7FF" font-size="19" font-weight="600">Trước hay sau phí sàn?</text>
    <!-- held-back number -->
    <g transform="translate(150,178)" opacity="0.55">
      <rect x="0" y="0" width="200" height="56" rx="14" fill="#0F172A" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="100" y="36" fill="#818CF8" font-size="26" font-weight="800" text-anchor="middle">?? đ</text>
    </g>
  </g>
</svg>
