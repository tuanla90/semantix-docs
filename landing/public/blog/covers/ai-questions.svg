<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg3)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Hỏi đúng câu hỏi</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Nút thắt là câu hỏi, không phải model</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: chat bubbles -->
  <g transform="translate(740,170)">
    <rect x="0" y="0" width="300" height="64" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="22" y="40" fill="#94A3B8" font-size="20">Doanh thu tháng này?</text>
    <rect x="60" y="84" width="320" height="64" rx="16" fill="url(#acc3)"/>
    <text x="80" y="124" fill="#fff" font-size="20" font-weight="600">...so với mục tiêu &amp; cùng kỳ?</text>
    <circle cx="330" cy="220" r="44" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="330" y="238" fill="#818CF8" font-size="48" font-weight="800" text-anchor="middle">?</text>
  </g>
</svg>
