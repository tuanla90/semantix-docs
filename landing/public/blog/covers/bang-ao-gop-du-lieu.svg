<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg-hd016" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="vt-hd016" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg-hd016)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Bảng ảo</text>
  <text x="80" y="296" fill="#CBD5E1" font-size="28" font-weight="600">Gộp ba kênh — không copy về kho</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: three source tables gather into one virtual table; no copy-to-warehouse arrow -->
  <g transform="translate(700,150)">
    <!-- three source tables (channels) -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="138" height="60" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="69" y="26" fill="#E2E8F0" font-size="17" text-anchor="middle">Shopee</text>
      <line x1="14" y1="38" x2="124" y2="38" stroke="#334155" stroke-width="1"/>
      <line x1="14" y1="48" x2="124" y2="48" stroke="#334155" stroke-width="1"/>
    </g>
    <g transform="translate(0,90)">
      <rect x="0" y="0" width="138" height="60" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="69" y="26" fill="#E2E8F0" font-size="17" text-anchor="middle">TikTok Shop</text>
      <line x1="14" y1="38" x2="124" y2="38" stroke="#334155" stroke-width="1"/>
      <line x1="14" y1="48" x2="124" y2="48" stroke="#334155" stroke-width="1"/>
    </g>
    <g transform="translate(0,180)">
      <rect x="0" y="0" width="138" height="60" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="69" y="26" fill="#E2E8F0" font-size="17" text-anchor="middle">KiotViet</text>
      <line x1="14" y1="38" x2="124" y2="38" stroke="#334155" stroke-width="1"/>
      <line x1="14" y1="48" x2="124" y2="48" stroke="#334155" stroke-width="1"/>
    </g>
    <!-- gather lines into the virtual table (no copy arrowhead) -->
    <path d="M138 30 C200 30 200 145 270 145" stroke="#818CF8" stroke-width="3" fill="none"/>
    <path d="M138 120 L270 145" stroke="#818CF8" stroke-width="3" fill="none"/>
    <path d="M138 210 C200 210 200 145 270 145" stroke="#818CF8" stroke-width="3" fill="none"/>
    <!-- the virtual table in the middle -->
    <rect x="270" y="92" width="190" height="106" rx="14" fill="url(#vt-hd016)" stroke="#818CF8" stroke-width="2"/>
    <text x="365" y="128" fill="#C7D2FE" font-size="20" font-weight="700" text-anchor="middle">Bảng ảo</text>
    <text x="365" y="156" fill="#A5B4FC" font-size="14" text-anchor="middle">UNION &amp; clean</text>
    <text x="365" y="180" fill="#818CF8" font-size="13" text-anchor="middle">+ cột nguồn</text>
    <!-- emphasis labels -->
    <rect x="282" y="222" width="166" height="34" rx="17" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="365" y="244" fill="#4ADE80" font-size="15" font-weight="700" text-anchor="middle">không copy • real-time</text>
  </g>
</svg>
