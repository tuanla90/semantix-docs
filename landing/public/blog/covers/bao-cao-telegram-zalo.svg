<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#0B2E2A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc13" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg13)"/>
  <g stroke="#134E4A" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#34D399" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Báo cáo tự tìm đến bạn</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="29" font-weight="600">Tự gửi mỗi sáng qua Telegram &amp; Zalo</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: chat bubble with mini report + clock for scheduled send -->
  <g transform="translate(760,150)">
    <!-- chat bubble -->
    <rect x="0" y="0" width="340" height="208" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <path d="M40 208 L40 240 L80 208 Z" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <!-- header line -->
    <text x="24" y="38" fill="#34D399" font-size="18" font-weight="700">📊 Báo cáo sáng — 7:30</text>
    <!-- revenue figure -->
    <text x="24" y="74" fill="#ffffff" font-size="26" font-weight="800">42,8 triệu</text>
    <text x="158" y="74" fill="#34D399" font-size="18" font-weight="700">▲ +12%</text>
    <!-- mini bar chart -->
    <g transform="translate(24,96)">
      <rect x="0"   y="44" width="20" height="22" rx="3" fill="#475569"/>
      <rect x="30"  y="30" width="20" height="36" rx="3" fill="#475569"/>
      <rect x="60"  y="36" width="20" height="30" rx="3" fill="#475569"/>
      <rect x="90"  y="14" width="20" height="52" rx="3" fill="url(#acc13)"/>
      <rect x="120" y="22" width="20" height="44" rx="3" fill="#475569"/>
      <rect x="150" y="8"  width="20" height="58" rx="3" fill="url(#acc13)"/>
    </g>
    <!-- alert line -->
    <text x="24" y="190" fill="#FBBF24" font-size="17" font-weight="600">⚠ Serum B5 còn 12 sản phẩm</text>
  </g>

  <!-- clock badge for scheduled send -->
  <g transform="translate(700,150)">
    <circle cx="40" cy="40" r="40" fill="#0F172A" stroke="#34D399" stroke-width="3"/>
    <circle cx="40" cy="40" r="40" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="63 251" stroke-linecap="round" transform="rotate(-90 40 40)"/>
    <line x1="40" y1="40" x2="40" y2="18" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="58" y2="46" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="3.5" fill="#34D399"/>
  </g>
</svg>
