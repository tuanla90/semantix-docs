<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgKt019" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrKt019" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgKt019)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Bắt đầu từ câu hỏi</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Câu hỏi trước &amp; dữ liệu theo sau</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: a question mark comes first, then leads to data/chart -->
  <g transform="translate(700,150)">
    <!-- the question first -->
    <circle cx="80" cy="120" r="78" fill="#0B1220" stroke="#818CF8" stroke-width="3"/>
    <text x="80" y="158" fill="#818CF8" font-size="96" font-weight="800" text-anchor="middle">?</text>
    <text x="80" y="232" fill="#94A3B8" font-size="18" font-weight="600" text-anchor="middle">Câu hỏi</text>
    <!-- arrow: question leads to data -->
    <path d="M168 120 L268 120" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arrKt019)"/>
    <!-- then the data / chart -->
    <rect x="286" y="40" width="200" height="160" rx="14" fill="#1E293B" stroke="#334155"/>
    <g transform="translate(310,70)">
      <rect x="0" y="78" width="22" height="34" rx="3" fill="#475569"/>
      <rect x="34" y="54" width="22" height="58" rx="3" fill="#64748B"/>
      <rect x="68" y="30" width="22" height="82" rx="3" fill="#7DD3FC"/>
      <rect x="102" y="44" width="22" height="68" rx="3" fill="#818CF8"/>
      <rect x="136" y="12" width="22" height="100" rx="3" fill="#4ADE80"/>
    </g>
    <text x="386" y="232" fill="#94A3B8" font-size="18" font-weight="600" text-anchor="middle">Dữ liệu</text>
  </g>
</svg>
