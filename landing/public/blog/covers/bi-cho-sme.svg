<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="a8" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg8)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">BI cho SME</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Dữ liệu rời rạc → một quyết định</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: scattered channels converge into one decision -->
  <g transform="translate(720,170)">
    <!-- source chips -->
    <rect x="0" y="0" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="75" y="29" fill="#E2E8F0" font-size="18" text-anchor="middle">Shopee</text>
    <rect x="0" y="92" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="75" y="121" fill="#E2E8F0" font-size="18" text-anchor="middle">TikTok Shop</text>
    <rect x="0" y="184" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="75" y="213" fill="#E2E8F0" font-size="18" text-anchor="middle">KiotViet</text>
    <!-- converging arrows -->
    <path d="M156 23 C235 23 235 105 300 115" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#a8)"/>
    <path d="M156 115 L300 115" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#a8)"/>
    <path d="M156 207 C235 207 235 125 300 115" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#a8)"/>
    <!-- the one decision -->
    <rect x="318" y="74" width="172" height="84" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="404" y="108" fill="#4ADE80" font-size="20" font-weight="700" text-anchor="middle">1 con số</text>
    <text x="404" y="136" fill="#94A3B8" font-size="16" text-anchor="middle">→ quyết định</text>
    <!-- mini bars under decision -->
    <g transform="translate(330,180)">
      <rect x="0" y="22" width="14" height="18" rx="2" fill="#475569"/>
      <rect x="22" y="12" width="14" height="28" rx="2" fill="#64748B"/>
      <rect x="44" y="0" width="14" height="40" rx="2" fill="#818CF8"/>
      <rect x="66" y="16" width="14" height="24" rx="2" fill="#64748B"/>
      <rect x="88" y="8" width="14" height="32" rx="2" fill="#7DD3FC"/>
      <rect x="110" y="20" width="14" height="20" rx="2" fill="#475569"/>
      <rect x="132" y="6" width="14" height="34" rx="2" fill="#4ADE80"/>
    </g>
  </g>
</svg>
