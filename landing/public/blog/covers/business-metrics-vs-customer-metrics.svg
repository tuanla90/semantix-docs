<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgKt043" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="coinBizKt043" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="coinCusKt043" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgKt043)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Chỉ số DN &amp; chỉ số khách</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="29" font-weight="600">Hai mặt của cùng một đồng xu</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: a two-sided coin — business face & customer face -->
  <g transform="translate(800,330)">
    <!-- back/customer coin, tilted behind -->
    <g transform="rotate(-14)">
      <ellipse cx="120" cy="0" rx="118" ry="138" fill="url(#coinCusKt043)" opacity="0.95"/>
      <ellipse cx="120" cy="0" rx="100" ry="118" fill="none" stroke="#C7D2FE" stroke-width="2" opacity="0.7"/>
      <text x="120" y="-30" fill="#EEF2FF" font-size="26" font-weight="800" text-anchor="middle">KHÁCH</text>
      <!-- heart -->
      <path d="M120 28 C120 10 96 6 96 28 C96 46 120 60 120 60 C120 60 144 46 144 28 C144 6 120 10 120 28 Z" fill="#EEF2FF"/>
      <text x="120" y="92" fill="#C7D2FE" font-size="17" text-anchor="middle">hài lòng</text>
    </g>
    <!-- front/business coin -->
    <g transform="rotate(8) translate(-150,30)">
      <ellipse cx="0" cy="0" rx="128" ry="148" fill="url(#coinBizKt043)"/>
      <ellipse cx="0" cy="0" rx="108" ry="126" fill="none" stroke="#DCFCE7" stroke-width="2" opacity="0.8"/>
      <text x="0" y="-34" fill="#052e16" font-size="28" font-weight="800" text-anchor="middle">DN</text>
      <text x="0" y="6" fill="#052e16" font-size="44" font-weight="800" text-anchor="middle">₫</text>
      <text x="0" y="64" fill="#14532d" font-size="18" font-weight="700" text-anchor="middle">doanh thu</text>
    </g>
    <!-- flip arrows hinting two faces -->
    <path d="M-150 -150 A 200 200 0 0 1 130 -150" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5 7"/>
  </g>
</svg>
