<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bghd020" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bghd020)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Cảnh báo KPI</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Chạm ngưỡng → chuông reo ngay</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: a KPI line dropping through a red threshold, then a bell -->
  <g transform="translate(700,150)">
    <!-- threshold line (red, dashed) -->
    <line x1="0" y1="190" x2="360" y2="190" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="0" y="178" fill="#F87171" font-size="17" font-weight="600">Ngưỡng cảnh báo</text>
    <!-- KPI line: holds high, then plunges below threshold -->
    <polyline points="0,70 70,55 140,85 210,120 280,215 350,250" fill="none" stroke="#6366F1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- data points -->
    <circle cx="0" cy="70" r="6" fill="#818CF8"/>
    <circle cx="70" cy="55" r="6" fill="#818CF8"/>
    <circle cx="140" cy="85" r="6" fill="#818CF8"/>
    <circle cx="210" cy="120" r="6" fill="#818CF8"/>
    <!-- breach point: where it crosses below the red line -->
    <circle cx="280" cy="215" r="9" fill="#EF4444" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="350" cy="250" r="6" fill="#F87171"/>
    <!-- alert bell -->
    <g transform="translate(400,80)">
      <circle cx="0" cy="0" r="58" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
      <g transform="translate(-26,-30)" fill="#FCA5A5">
        <path d="M26 4 a4 4 0 0 1 8 0 c11 3 18 13 18 26 v14 l8 10 H0 l8 -10 v-14 c0 -13 7 -23 18 -26 Z"/>
        <path d="M22 56 a8 7 0 0 0 16 0 Z"/>
      </g>
      <!-- ringing waves -->
      <path d="M70 -22 q14 22 0 44" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
      <path d="M84 -34 q22 34 0 68" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
