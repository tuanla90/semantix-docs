<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc15" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar15" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <marker id="arrow15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg15)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <text x="80" y="208" fill="#ffffff" font-size="48" font-weight="800">Chủ shop đa kênh</text>
  <text x="80" y="262" fill="#CBD5E1" font-size="26" font-weight="600">Thay cả đội data bằng AI — câu trả lời lúc 11h đêm</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: chủ shop hỏi tiếng Việt -> ba kênh hội tụ -> biểu đồ trả lời -->
  <g transform="translate(700,330)">
    <!-- person: chủ shop -->
    <g transform="translate(0,40)">
      <circle cx="40" cy="0" r="26" fill="#1E293B" stroke="#818CF8" stroke-width="2.5"/>
      <circle cx="40" cy="-8" r="9" fill="#A5B4FC"/>
      <path d="M22 12 a18 16 0 0 1 36 0 z" fill="#A5B4FC"/>
    </g>

    <!-- speech bubble: Vietnamese question -->
    <g transform="translate(78,-2)">
      <rect x="0" y="0" width="190" height="58" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
      <path d="M14 58 L26 58 L14 74 z" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
      <text x="16" y="26" fill="#E0E7FF" font-size="16" font-weight="700">"Kênh nào lời</text>
      <text x="16" y="46" fill="#E0E7FF" font-size="16" font-weight="700">thật sau phí?"</text>
    </g>

    <!-- three channels converging -->
    <g transform="translate(0,-120)">
      <g stroke="#818CF8" stroke-width="2.2" fill="none" opacity="0.75">
        <path d="M58 18 C 130 30, 150 55, 168 70" marker-end="url(#arrow15)"/>
        <path d="M158 18 L 200 60" marker-end="url(#arrow15)"/>
        <path d="M258 18 C 230 30, 215 50, 205 64" marker-end="url(#arrow15)"/>
      </g>
      <g transform="translate(0,-22)">
        <rect x="6" y="0" width="104" height="40" rx="10" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
        <text x="58" y="26" fill="#FB923C" font-size="17" font-weight="700" text-anchor="middle">Shopee</text>
      </g>
      <g transform="translate(108,-22)">
        <rect x="6" y="0" width="104" height="40" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
        <text x="58" y="26" fill="#67E8F9" font-size="14" font-weight="700" text-anchor="middle">TikTok Shop</text>
      </g>
      <g transform="translate(216,-22)">
        <rect x="6" y="0" width="104" height="40" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
        <text x="58" y="26" fill="#6EE7B7" font-size="17" font-weight="700" text-anchor="middle">KiotViet</text>
      </g>
    </g>

    <!-- answer: chart panel -->
    <g transform="translate(300,-30)">
      <rect x="0" y="0" width="180" height="150" rx="16" fill="url(#acc15)"/>
      <text x="90" y="28" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">CÂU TRẢ LỜI</text>
      <g transform="translate(24,44)">
        <rect x="0" y="56" width="22" height="40" rx="3" fill="url(#bar15)"/>
        <rect x="34" y="34" width="22" height="62" rx="3" fill="url(#bar15)"/>
        <rect x="68" y="14" width="22" height="82" rx="3" fill="url(#bar15)"/>
        <rect x="102" y="44" width="22" height="52" rx="3" fill="url(#bar15)"/>
        <line x1="-4" y1="100" x2="132" y2="100" stroke="#E0E7FF" stroke-width="2" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
