<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgc2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="0.6" stop-color="#1E1B4B"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgc2)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <rect x="80" y="96" width="170" height="40" rx="20" fill="#312E81"/>
  <text x="165" y="123" fill="#C7D2FE" font-size="20" font-weight="700" text-anchor="middle">PHẦN 2 / 4</text>
  <text x="270" y="124" fill="#818CF8" font-size="20" font-weight="700" letter-spacing="3">SERIES COHORT ANALYSIS</text>
  <text x="80" y="232" fill="#ffffff" font-size="50" font-weight="800">Retention &amp; PMF</text>
  <text x="80" y="296" fill="#CBD5E1" font-size="30" font-weight="600">Đường cong giữ chân kể sự thật</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: retention curves -->
  <g transform="translate(740,321) scale(0.839)">
    <line x1="0" y1="0" x2="0" y2="220" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="220" x2="360" y2="220" stroke="#475569" stroke-width="2"/>
    <!-- curve A: decays to 0 -->
    <path d="M0 20 C 90 120, 180 200, 360 215" fill="none" stroke="#F87171" stroke-width="4"/>
    <!-- curve B: flattens ~40% -->
    <path d="M0 20 C 90 90, 160 120, 360 120" fill="none" stroke="#4ADE80" stroke-width="4"/>
    <!-- curve C: smile, goes up -->
    <path d="M0 20 C 90 110, 150 130, 360 70" fill="none" stroke="#818CF8" stroke-width="4"/>
    <circle cx="360" cy="215" r="5" fill="#F87171"/>
    <circle cx="360" cy="120" r="5" fill="#4ADE80"/>
    <circle cx="360" cy="70" r="5" fill="#818CF8"/>
    <text x="372" y="219" fill="#FCA5A5" font-size="16">churn</text>
    <text x="372" y="124" fill="#86EFAC" font-size="16">PMF</text>
    <text x="372" y="74" fill="#C7D2FE" font-size="16">negative churn</text>
  </g>
</svg>
