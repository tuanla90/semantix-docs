<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgUc002" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accUc002" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="barUc002" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <marker id="arrowUc002" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgUc002)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <text x="80" y="208" fill="#ffffff" font-size="48" font-weight="800">COO &amp; 5 báo cáo mỗi tuần</text>
  <text x="80" y="262" fill="#CBD5E1" font-size="26" font-weight="600">Càng nhiều báo cáo, quyết định càng đến chậm</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: chồng báo cáo + lịch tuần + đồng hồ -> một màn hình trả lời tức thì -->
  <g transform="translate(690,320)">
    <!-- stack of weekly reports (the slow past) -->
    <g transform="translate(0,-90)">
      <rect x="0" y="0" width="150" height="186" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <rect x="12" y="-12" width="150" height="186" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <rect x="24" y="-24" width="150" height="186" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <g transform="translate(24,-24)" stroke="#64748B" stroke-width="3" opacity="0.7">
        <line x1="20" y1="34" x2="130" y2="34"/>
        <line x1="20" y1="58" x2="130" y2="58"/>
        <line x1="20" y1="82" x2="110" y2="82"/>
        <line x1="20" y1="106" x2="130" y2="106"/>
        <line x1="20" y1="130" x2="96" y2="130"/>
      </g>
      <text x="99" y="-2" fill="#94A3B8" font-size="14" font-weight="700" text-anchor="middle">Tuần trước</text>
    </g>

    <!-- clock badge: too late -->
    <g transform="translate(-30,118)">
      <circle cx="0" cy="0" r="30" fill="#1E293B" stroke="#F97316" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="14" y2="6" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#FB923C"/>
    </g>

    <!-- convergence arrow: many reports -> one instant answer -->
    <g stroke="#818CF8" stroke-width="3" fill="none" opacity="0.85">
      <path d="M190 30 C 250 30, 270 30, 300 30" marker-end="url(#arrowUc002)"/>
    </g>

    <!-- answer: instant screen -->
    <g transform="translate(312,-66)">
      <rect x="0" y="0" width="196" height="172" rx="16" fill="url(#accUc002)"/>
      <text x="98" y="30" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">TRẢ LỜI NGAY</text>
      <text x="98" y="52" fill="#E0E7FF" font-size="12" font-weight="600" text-anchor="middle">"Kho nào sắp hết?"</text>
      <g transform="translate(30,66)">
        <rect x="0" y="58" width="24" height="42" rx="3" fill="url(#barUc002)"/>
        <rect x="38" y="34" width="24" height="66" rx="3" fill="url(#barUc002)"/>
        <rect x="76" y="14" width="24" height="86" rx="3" fill="url(#barUc002)"/>
        <rect x="114" y="46" width="24" height="54" rx="3" fill="url(#barUc002)"/>
        <line x1="-4" y1="104" x2="146" y2="104" stroke="#E0E7FF" stroke-width="2" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
