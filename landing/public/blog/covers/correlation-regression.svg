    <circle cx="70" cy="248" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="95" cy="232" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="120" cy="225" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="150" cy="200" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="175" cy="195" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="205" cy="165" r="8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="235" cy="158" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="260" cy="130" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="290" cy="118" r="8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="315" cy="92" r="8" fill="#818CF8" opacity="0.85"/>
