    <line x1="0" y1="300" x2="360" y2="300" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#334155" stroke-width="2"/>
    <!-- regression line (dashed red, sloping up) -->
    <line x1="20" y1="270" x2="340" y2="50" stroke="#EF4444" stroke-width="3" stroke-dasharray="8 6"/>
