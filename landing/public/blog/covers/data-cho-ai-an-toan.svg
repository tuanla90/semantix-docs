<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt012" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="akt012" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt012)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Dữ liệu cho AI: ai giữ chìa?</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="28" font-weight="600">Rủi ro ở kiến trúc, không ở model</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: locked data, AI looks through a control layer, key in owner's hand -->
  <g transform="translate(720,274) scale(0.988)">
    <!-- the data vault (locked) -->
    <rect x="0" y="40" width="150" height="170" rx="14" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <text x="75" y="74" fill="#94A3B8" font-size="15" text-anchor="middle">DỮ LIỆU THÔ</text>
    <!-- stacked data rows -->
    <g transform="translate(20,92)">
      <rect x="0" y="0" width="110" height="14" rx="3" fill="#1E293B"/>
      <rect x="0" y="22" width="110" height="14" rx="3" fill="#1E293B"/>
      <rect x="0" y="44" width="110" height="14" rx="3" fill="#1E293B"/>
      <rect x="0" y="66" width="110" height="14" rx="3" fill="#1E293B"/>
    </g>
    <!-- padlock on the vault -->
    <g transform="translate(60,178)">
      <rect x="0" y="14" width="30" height="22" rx="4" fill="#FBBF24"/>
      <path d="M6 14 V8 a9 9 0 0 1 18 0 V14" stroke="#FBBF24" stroke-width="4" fill="none"/>
      <circle cx="15" cy="24" r="3" fill="#0B1220"/>
    </g>
    <!-- control layer (the only window) -->
    <rect x="190" y="74" width="58" height="102" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/>
    <text x="219" y="60" fill="#818CF8" font-size="13" text-anchor="middle" font-weight="700">LỚP</text>
    <text x="219" y="196" fill="#818CF8" font-size="13" text-anchor="middle" font-weight="700">KIỂM SOÁT</text>
    <!-- AI looking through the layer, only aggregate result returns -->
    <path d="M156 125 L188 125" stroke="#475569" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
    <path d="M250 125 L300 125" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt012)"/>
    <rect x="312" y="92" width="86" height="66" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="355" y="122" fill="#4ADE80" font-size="22" font-weight="800" text-anchor="middle">AI</text>
    <text x="355" y="145" fill="#94A3B8" font-size="13" text-anchor="middle">chỉ thấy</text>
    <!-- the key in owner's hand (BYOK) -->
    <g transform="translate(120,260)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#4ADE80" stroke-width="4"/>
      <rect x="17" y="7" width="40" height="6" rx="2" fill="#4ADE80"/>
      <rect x="48" y="13" width="6" height="9" rx="1" fill="#4ADE80"/>
      <rect x="40" y="13" width="6" height="9" rx="1" fill="#4ADE80"/>
      <text x="74" y="18" fill="#4ADE80" font-size="16" font-weight="700">BYOK — bạn giữ chìa</text>
    </g>
  </g>
</svg>
