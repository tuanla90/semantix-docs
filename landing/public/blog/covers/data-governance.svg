<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="own" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <!-- title -->
  <text x="80" y="162" fill="#F1F5F9" font-size="48" font-weight="800">Data governance cho SME</text>
  <text x="80" y="214" fill="#94A3B8" font-size="26" font-weight="500">Ai sở hữu con số &amp; ai chịu trách nhiệm</text>
  <text x="80" y="248" fill="#94A3B8" font-size="26" font-weight="500">khi nó sai</text>
  <!-- illustration: each number carries an owner + a lock -->
  <g transform="translate(80,310)">
    <!-- row 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="1040" height="68" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
      <text x="26" y="42" fill="#E2E8F0" font-size="22" font-weight="700">Doanh thu thuần</text>
      <text x="360" y="42" fill="#34D399" font-size="22" font-weight="800">1,8 tỷ</text>
      <!-- owner chip -->
      <rect x="560" y="18" width="240" height="34" rx="17" fill="#0B2A2E" stroke="#22D3EE" stroke-width="1.5"/>
      <circle cx="584" cy="35" r="11" fill="url(#own)"/>
      <text x="604" y="41" fill="#22D3EE" font-size="16" font-weight="700">chủ: Kế toán</text>
      <!-- lock -->
      <g transform="translate(950,18)">
        <rect x="0" y="12" width="34" height="26" rx="5" fill="#22D3EE"/>
        <path d="M6 12 v-6 a11 11 0 0 1 22 0 v6" fill="none" stroke="#22D3EE" stroke-width="4"/>
        <circle cx="17" cy="24" r="4" fill="#0B1120"/>
      </g>
    </g>
    <!-- row 2 -->
    <g transform="translate(0,84)">
      <rect x="0" y="0" width="1040" height="68" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
      <text x="26" y="42" fill="#E2E8F0" font-size="22" font-weight="700">Khách hàng mới</text>
      <text x="360" y="42" fill="#34D399" font-size="22" font-weight="800">412</text>
      <rect x="560" y="18" width="240" height="34" rx="17" fill="#0B2A2E" stroke="#22D3EE" stroke-width="1.5"/>
      <circle cx="584" cy="35" r="11" fill="url(#own)"/>
      <text x="604" y="41" fill="#22D3EE" font-size="16" font-weight="700">chủ: Sales</text>
      <g transform="translate(950,18)">
        <rect x="0" y="12" width="34" height="26" rx="5" fill="#22D3EE"/>
        <path d="M6 12 v-6 a11 11 0 0 1 22 0 v6" fill="none" stroke="#22D3EE" stroke-width="4"/>
        <circle cx="17" cy="24" r="4" fill="#0B1120"/>
      </g>
    </g>
    <!-- row 3: orphan number -->
    <g transform="translate(0,168)">
      <rect x="0" y="0" width="1040" height="68" rx="12" fill="#1A0F14" stroke="#7F1D1D" stroke-width="2"/>
      <text x="26" y="42" fill="#E2E8F0" font-size="22" font-weight="700">Tỷ lệ chuyển đổi</text>
      <text x="360" y="42" fill="#F87171" font-size="22" font-weight="800">1,8%</text>
      <rect x="560" y="18" width="240" height="34" rx="17" fill="#2A0B0B" stroke="#F87171" stroke-width="1.5"/>
      <text x="604" y="41" fill="#F87171" font-size="16" font-weight="700">chủ: không ai</text>
      <text x="938" y="41" fill="#F87171" font-size="30" font-weight="800">?</text>
    </g>
  </g>
  <!-- footer -->
  <text x="80" y="582" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
