<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt038" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowkt038" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt038)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Data quality</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">6 chiều của chất lượng dữ liệu</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: radar hexagon of 6 quality dimensions, before/after -->
  <g transform="translate(910,300)">
    <circle cx="0" cy="0" r="230" fill="url(#glowkt038)"/>
    <!-- hexagon rings (6 axes) -->
    <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.55">
      <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"/>
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"/>
    </g>
    <!-- axis spokes -->
    <g stroke="#334155" stroke-width="1.5" opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-180"/>
      <line x1="0" y1="0" x2="156" y2="-90"/>
      <line x1="0" y1="0" x2="156" y2="90"/>
      <line x1="0" y1="0" x2="0" y2="180"/>
      <line x1="0" y1="0" x2="-156" y2="90"/>
      <line x1="0" y1="0" x2="-156" y2="-90"/>
    </g>
    <!-- before: lopsided red -->
    <polygon points="0,-108 94,-54 62,36 0,126 -101,58 -78,-45" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-width="2.5"/>
    <!-- after: full green -->
    <polygon points="0,-166 144,-83 145,84 0,162 -141,81 -150,-87" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2.5"/>
    <!-- axis dots -->
    <g fill="#818CF8">
      <circle cx="0" cy="-180" r="4"/>
      <circle cx="156" cy="-90" r="4"/>
      <circle cx="156" cy="90" r="4"/>
      <circle cx="0" cy="180" r="4"/>
      <circle cx="-156" cy="90" r="4"/>
      <circle cx="-156" cy="-90" r="4"/>
    </g>
    <!-- axis labels -->
    <g fill="#94A3B8" font-size="15" font-weight="600" text-anchor="middle">
      <text x="0" y="-196">Chính xác</text>
      <text x="196" y="-86">Đầy đủ</text>
      <text x="196" y="100">Nhất quán</text>
      <text x="0" y="206">Kịp thời</text>
      <text x="-196" y="100">Hợp lệ</text>
      <text x="-196" y="-86">Duy nhất</text>
    </g>
  </g>
</svg>
