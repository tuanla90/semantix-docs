<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt008" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt008)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Data warehouse</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Đúng kỹ thuật — sai quy mô?</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: a big warehouse with a "có cần?" question vs a small box that fits the SME -->
  <g transform="translate(700,160)">
    <!-- big warehouse (over-scaled, dimmed) -->
    <g opacity="0.85">
      <rect x="0" y="70" width="230" height="170" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
      <path d="M-6 70 L115 8 L236 70 Z" fill="#0B1220" stroke="#334155" stroke-width="2"/>
      <!-- warehouse door + slats -->
      <rect x="78" y="150" width="74" height="90" rx="3" fill="#0B1220" stroke="#334155"/>
      <line x1="78" y1="172" x2="152" y2="172" stroke="#334155"/>
      <line x1="78" y1="194" x2="152" y2="194" stroke="#334155"/>
      <line x1="78" y1="216" x2="152" y2="216" stroke="#334155"/>
      <rect x="22" y="100" width="40" height="34" rx="3" fill="#0B1220" stroke="#334155"/>
      <rect x="168" y="100" width="40" height="34" rx="3" fill="#0B1220" stroke="#334155"/>
    </g>
    <!-- "có cần?" question hovering over the big warehouse -->
    <circle cx="115" cy="-12" r="30" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/>
    <text x="115" y="0" fill="#F59E0B" font-size="34" font-weight="800" text-anchor="middle">?</text>
    <text x="115" y="276" fill="#64748B" font-size="17" font-weight="600" text-anchor="middle">kho lớn — có cần?</text>
    <!-- small box that fits the SME (highlighted) -->
    <g transform="translate(300,150)">
      <rect x="0" y="40" width="120" height="86" rx="8" fill="#0B1220" stroke="#4ADE80" stroke-width="2.5"/>
      <path d="M0 40 L60 14 L120 40" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
      <line x1="60" y1="14" x2="60" y2="126" stroke="#4ADE80" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="40" x2="60" y2="66" stroke="#4ADE80" stroke-width="1.5" opacity="0.6"/>
      <line x1="120" y1="40" x2="60" y2="66" stroke="#4ADE80" stroke-width="1.5" opacity="0.6"/>
      <text x="60" y="160" fill="#4ADE80" font-size="17" font-weight="700" text-anchor="middle">vừa đủ cho SME</text>
    </g>
  </g>
</svg>
