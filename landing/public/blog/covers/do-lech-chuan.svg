  <text x="80" y="222" fill="#F1F5F9" font-size="50" font-weight="800">Độ lệch chuẩn &amp; phương sai</text>
  <text x="80" y="272" fill="#94A3B8" font-size="26" font-weight="500">Vì sao trung bình cần đi kèm độ phân tán —</text>
  <text x="80" y="306" fill="#94A3B8" font-size="26" font-weight="500">cùng mean, hai số phận hoàn toàn khác</text>
