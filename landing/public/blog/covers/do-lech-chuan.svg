    <path d="M520 500 C580 500 595 370 620 370 C645 370 660 500 720 500 Z" fill="url(#narrow)" stroke="#34D399" stroke-width="2.5"/>
    <path d="M300 500 C470 500 560 410 620 410 C680 410 770 500 940 500 Z" fill="url(#wide)" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="620" y="356" fill="#34D399" font-size="17" font-weight="700" text-anchor="middle">hẹp · ổn định</text>
    <text x="905" y="470" fill="#22D3EE" font-size="17" font-weight="700" text-anchor="middle">rộng</text>
    <text x="905" y="492" fill="#22D3EE" font-size="17" font-weight="700" text-anchor="middle">bấp bênh</text>
