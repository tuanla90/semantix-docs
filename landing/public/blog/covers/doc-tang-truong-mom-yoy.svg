<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- title -->
  <text x="80" y="160" fill="#F1F5F9" font-size="48" font-weight="800">Đọc tăng trưởng đúng cách</text>
  <text x="80" y="212" fill="#94A3B8" font-size="26" font-weight="500">MoM, YoY &amp; những cái bẫy số liệu —</text>
  <text x="80" y="246" fill="#94A3B8" font-size="26" font-weight="500">khi cùng một dữ liệu vừa tăng vừa tụt</text>
  <!-- illustration: two arrows on same data -->
  <g transform="translate(80,300)">
    <rect x="0" y="0" width="1040" height="220" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <line x1="40" y1="180" x2="1000" y2="180" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="36" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">CÙNG MỘT BỘ DỮ LIỆU, HAI MŨI TÊN</text>
    <!-- MoM arrow: steep up but illusory -->
    <path d="M120 160 L420 70" stroke="url(#up)" stroke-width="6" stroke-linecap="round"/>
    <path d="M420 70 L398 78 L408 96 Z" fill="#4ADE80"/>
    <text x="150" y="148" fill="#34D399" font-size="22" font-weight="800">MoM +30%</text>
    <text x="150" y="172" fill="#64748B" font-size="14">so tháng trước — lên ảo (mùa vụ)</text>
    <!-- YoY arrow: gentle down, true -->
    <path d="M600 90 L900 140" stroke="url(#down)" stroke-width="6" stroke-linecap="round"/>
    <path d="M900 140 L878 124 L872 146 Z" fill="#F87171"/>
    <text x="600" y="80" fill="#F87171" font-size="22" font-weight="800">YoY −8%</text>
    <text x="600" y="172" fill="#64748B" font-size="14">so cùng kỳ năm trước — sự thật</text>
    <!-- divider -->
    <line x1="510" y1="56" x2="510" y2="170" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 6"/>
  </g>
  <!-- footer -->
  <text x="80" y="568" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
