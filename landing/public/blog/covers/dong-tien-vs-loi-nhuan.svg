<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgPt053" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cashFillPt053" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgPt053)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="206" fill="#ffffff" font-size="52" font-weight="800">Dòng tiền vs lợi nhuận</text>
  <text x="80" y="262" fill="#CBD5E1" font-size="28" font-weight="600">Lãi trên giấy &amp; cạn tiền trong két</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: profit line rising, cash line falling below zero -->
  <g transform="translate(700,300)">
    <!-- zero baseline -->
    <line x1="0" y1="60" x2="420" y2="60" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.7"/>
    <text x="424" y="65" fill="#94A3B8" font-size="16">0 — cạn tiền</text>
    <!-- cash flow area (falling below zero) -->
    <path d="M0 30 L84 50 L168 78 L252 110 L336 150 L420 196 L420 60 L0 60 Z" fill="url(#cashFillPt053)"/>
    <!-- profit line (rising) -->
    <polyline points="0,40 84,18 168,-8 252,-40 336,-78 420,-120" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="420" cy="-120" r="6" fill="#10B981"/>
    <text x="420" y="-132" fill="#10B981" font-size="17" font-weight="700" text-anchor="end">Lợi nhuận sổ sách</text>
    <!-- cash line (falling) -->
    <polyline points="0,30 84,50 168,78 252,110 336,150 420,196" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="420" cy="196" r="6" fill="#EF4444"/>
    <text x="420" y="222" fill="#EF4444" font-size="17" font-weight="700" text-anchor="end">Tiền mặt thực</text>
  </g>
</svg>
