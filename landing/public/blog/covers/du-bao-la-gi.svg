<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- series badge -->
  <g transform="translate(80,112)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#0B1120" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="98" y="23" fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">SERIES &#183; PHẦN 1</text>
  </g>
  <!-- title -->
  <text x="80" y="226" fill="#F1F5F9" font-size="50" font-weight="800">Mọi dự báo đều sai —</text>
  <text x="80" y="284" fill="#F1F5F9" font-size="50" font-weight="800">và vì sao vẫn nên làm</text>
  <!-- subtitle -->
  <text x="80" y="332" fill="#94A3B8" font-size="24" font-weight="500">Dự báo cho doanh nghiệp &#8226; nhập môn cho SME</text>
  <!-- illustration: actual line into dashed forecast + error band -->
  <g transform="translate(80,380)">
    <!-- axis -->
    <line x1="0" y1="150" x2="1040" y2="150" stroke="#1E293B" stroke-width="2"/>
    <line x1="560" y1="20" x2="560" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="500" y="14" fill="#64748B" font-size="14" font-weight="600">hôm nay</text>
    <!-- error band loe dan -->
    <path d="M560,86 L740,64 L900,44 L1040,26 L1040,128 L900,118 L740,108 L560,86 Z" fill="url(#band)"/>
    <!-- actual line -->
    <polyline points="20,128 130,118 250,108 380,98 470,92 560,86" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="20" cy="128" r="5" fill="#94A3B8"/>
    <circle cx="250" cy="108" r="5" fill="#94A3B8"/>
    <circle cx="470" cy="92" r="5" fill="#94A3B8"/>
    <circle cx="560" cy="86" r="6" fill="#E2E8F0"/>
    <!-- forecast dashed -->
    <polyline points="560,86 740,76 900,68 1040,60" fill="none" stroke="#22D3EE" stroke-width="3" stroke-dasharray="9 6"/>
    <circle cx="740" cy="76" r="5" fill="#22D3EE"/>
    <circle cx="900" cy="68" r="5" fill="#22D3EE"/>
    <circle cx="1040" cy="60" r="5" fill="#22D3EE"/>
    <!-- labels -->
    <text x="150" y="156" fill="#94A3B8" font-size="15" font-weight="600">thực tế</text>
    <text x="760" y="48" fill="#22D3EE" font-size="15" font-weight="700">dự báo + dải sai số</text>
  </g>
  <!-- footer -->
  <text x="80" y="572" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX &#8226; BLOG</text>
</svg>
