<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- series badge -->
  <g transform="translate(80,112)">
    <rect x="0" y="0" width="320" height="34" rx="17" fill="#0F2A2E" stroke="#164E45" stroke-width="1.5"/>
    <text x="20" y="23" fill="#34D399" font-size="15" font-weight="700" letter-spacing="1">SERIES &#183; PHẦN 3 (CUỐI)</text>
  </g>
  <!-- title -->
  <text x="80" y="210" fill="#F1F5F9" font-size="48" font-weight="800">Dự báo nhu cầu tồn kho</text>
  <text x="80" y="262" fill="#94A3B8" font-size="25" font-weight="500">Từ xu hướng &amp; mùa vụ tới điểm đặt hàng —</text>
  <text x="80" y="296" fill="#94A3B8" font-size="25" font-weight="500">vừa hết cháy hàng, vừa hết ế kho</text>
  <!-- illustration: forecast line + safety band + reorder arrow -->
  <g transform="translate(80,330)">
    <rect x="0" y="0" width="1040" height="200" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <!-- axes -->
    <line x1="40" y1="40" x2="40" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="1000" y2="160" stroke="#334155" stroke-width="1.5"/>
    <!-- error band around forecast -->
    <path d="M40 120 C 220 96, 430 80, 640 58 C 760 46, 880 40, 1000 36 L1000 70 C 880 74, 760 80, 640 92 C 430 114, 220 130, 40 154 Z" fill="url(#band)"/>
    <!-- history (solid) -->
    <polyline points="40,138 130,128 220,132 310,116 400,108" fill="none" stroke="#64748B" stroke-width="3"/>
    <!-- forecast (gradient, dashed) -->
    <polyline points="400,108 520,90 640,75 760,60 880,50 1000,52" fill="none" stroke="url(#line)" stroke-width="4" stroke-dasharray="2 0"/>
    <!-- Tet peak marker -->
    <circle cx="880" cy="50" r="6" fill="#22D3EE"/>
    <text x="846" y="34" fill="#22D3EE" font-size="14" font-weight="700">đỉnh Tết</text>
    <!-- safety stock line -->
    <line x1="40" y1="148" x2="1000" y2="148" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="48" y="142" fill="#FBBF24" font-size="13" font-weight="700">tồn an toàn</text>
    <!-- reorder point arrow -->
    <g transform="translate(610,75)">
      <line x1="0" y1="0" x2="0" y2="68" stroke="#F87171" stroke-width="2.5"/>
      <path d="M-8 56 L0 72 L8 56 Z" fill="#F87171"/>
      <text x="14" y="48" fill="#FCA5A5" font-size="14" font-weight="800">ĐẶT HÀNG</text>
    </g>
  </g>
  <!-- footer -->
  <text x="80" y="572" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX &#8226; BLOG</text>
</svg>
