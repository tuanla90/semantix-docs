    <!-- clean table -->
    <rect x="280" y="0" width="220" height="160" rx="12" fill="#0B1220" stroke="#334155"/>
    <line x1="280" y1="42" x2="500" y2="42" stroke="#334155"/>
    <text x="298" y="28" fill="#7DD3FC" font-size="18" font-family="monospace">kênh</text>
    <text x="410" y="28" fill="#7DD3FC" font-size="18" font-family="monospace">doanh thu</text>
    <text x="298" y="70" fill="#E2E8F0" font-size="18" font-family="monospace">Shopee</text>
    <text x="410" y="70" fill="#E2E8F0" font-size="18" font-family="monospace">4,2 tỷ</text>
    <text x="298" y="102" fill="#E2E8F0" font-size="18" font-family="monospace">TikTok</text>
