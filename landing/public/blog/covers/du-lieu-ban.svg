    <rect x="-20" y="84" width="200" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="-6" y="107" fill="#FCA5A5" font-size="18" font-family="monospace">SP   30/06</text>
    <rect x="-20" y="126" width="200" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="-6" y="149" fill="#FCA5A5" font-size="18" font-family="monospace">NULL  4,2tỷ</text>
