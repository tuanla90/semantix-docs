<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgDad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="aDad" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgDad)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Title block -->
  <text x="80" y="138" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="222" fill="#ffffff" font-size="52" font-weight="800">Hai AI tranh luận</text>
  <text x="80" y="284" fill="#CBD5E1" font-size="28" font-weight="600">Đề xuất ⇄ phản biện → báo cáo đáng tin</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: two debating agents converging to a verified verdict -->
  <g transform="translate(700,150)">
    <!-- Agent A: proposer -->
    <g transform="translate(0,30)">
      <circle cx="60" cy="60" r="56" fill="#1E293B" stroke="#818CF8" stroke-width="3"/>
      <text x="60" y="52" fill="#C7D2FE" font-size="22" font-weight="800" text-anchor="middle">A</text>
      <text x="60" y="80" fill="#94A3B8" font-size="15" text-anchor="middle">đề xuất</text>
    </g>
    <!-- Agent B: critic -->
    <g transform="translate(0,200)">
      <circle cx="60" cy="60" r="56" fill="#1E293B" stroke="#34D399" stroke-width="3"/>
      <text x="60" y="52" fill="#A7F3D0" font-size="22" font-weight="800" text-anchor="middle">B</text>
      <text x="60" y="80" fill="#94A3B8" font-size="15" text-anchor="middle">phản biện</text>
    </g>

    <!-- cross-check arrows between A and B -->
    <path d="M132 110 C200 130 200 180 138 210" fill="none" stroke="#818CF8" stroke-width="3" marker-end="url(#aDad)"/>
    <path d="M138 250 C200 280 200 330 132 350" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#aDad)"/>

    <!-- converge arrows to verdict -->
    <path d="M120 90 L300 210" stroke="#818CF8" stroke-width="3" marker-end="url(#aDad)"/>
    <path d="M120 320 L300 230" stroke="#34D399" stroke-width="3" marker-end="url(#aDad)"/>

    <!-- verdict card with check -->
    <g transform="translate(330,150)">
      <rect x="0" y="0" width="140" height="120" rx="16" fill="#13203A" stroke="#34D399" stroke-width="3"/>
      <path d="M40 64 L60 86 L104 38" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="108" fill="#A7F3D0" font-size="15" font-weight="700" text-anchor="middle">đáng tin</text>
    </g>
  </g>
</svg>
