<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt011" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="akt011" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt011)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">ETL vs ELT</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Đảo thứ tự T &amp; L — đảo cả quyền hỏi data</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: two pipelines E-T-L and E-L-T with T/L blocks swapped -->
  <g transform="translate(700,360)">
    <!-- row 1: E - T - L -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#1E293B" stroke="#334155"/>
      <text x="28" y="37" fill="#E2E8F0" font-size="26" font-weight="800" text-anchor="middle">E</text>
      <path d="M62 28 L96 28" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt011)"/>
      <rect x="104" y="0" width="56" height="56" rx="12" fill="#312E81" stroke="#818CF8"/>
      <text x="132" y="37" fill="#C7D2FE" font-size="26" font-weight="800" text-anchor="middle">T</text>
      <path d="M166 28 L200 28" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt011)"/>
      <rect x="208" y="0" width="56" height="56" rx="12" fill="#0B1220" stroke="#4ADE80"/>
      <text x="236" y="37" fill="#4ADE80" font-size="26" font-weight="800" text-anchor="middle">L</text>
      <text x="288" y="37" fill="#64748B" font-size="18" font-weight="600">nấu sẵn rồi cất</text>
    </g>
    <!-- swap indicator -->
    <g transform="translate(110,78)" opacity="0.7">
      <path d="M24 4 C 70 24, 70 24, 116 4" stroke="#64748B" stroke-width="2" fill="none"/>
      <path d="M116 44 C 70 24, 70 24, 24 44" stroke="#64748B" stroke-width="2" fill="none"/>
      <text x="70" y="30" fill="#94A3B8" font-size="14" font-weight="700" text-anchor="middle">đảo T ↔ L</text>
    </g>
    <!-- row 2: E - L - T -->
    <g transform="translate(0,96)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#1E293B" stroke="#334155"/>
      <text x="28" y="37" fill="#E2E8F0" font-size="26" font-weight="800" text-anchor="middle">E</text>
      <path d="M62 28 L96 28" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt011)"/>
      <rect x="104" y="0" width="56" height="56" rx="12" fill="#0B1220" stroke="#4ADE80"/>
      <text x="132" y="37" fill="#4ADE80" font-size="26" font-weight="800" text-anchor="middle">L</text>
      <path d="M166 28 L200 28" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt011)"/>
      <rect x="208" y="0" width="56" height="56" rx="12" fill="#312E81" stroke="#818CF8"/>
      <text x="236" y="37" fill="#C7D2FE" font-size="26" font-weight="800" text-anchor="middle">T</text>
      <text x="288" y="37" fill="#94A3B8" font-size="18" font-weight="600">cất thô, nấu khi cần</text>
    </g>
  </g>
</svg>
