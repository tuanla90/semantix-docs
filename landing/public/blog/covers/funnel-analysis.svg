<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="0.55" stop-color="#0B3B36"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgf)"/>
  <g stroke="#134E48" stroke-width="1" opacity="0.4">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- label -->
  <rect x="80" y="92" width="290" height="40" rx="20" fill="#134E48"/>
  <text x="225" y="119" fill="#5EEAD4" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="2">PHÂN TÍCH DỮ LIỆU</text>

  <!-- title -->
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Funnel Analysis</text>
  <text x="80" y="292" fill="#CBD5E1" font-size="29" font-weight="600">Tìm chỗ rò rỉ trong phễu bán hàng</text>
  <text x="80" y="338" fill="#5EEAD4" font-size="22" font-weight="600">Bịt đúng một chỗ — lời gấp 5 lần vá khắp nơi</text>

  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: stylized funnel -->
  <g transform="translate(800,150)">
    <rect x="0"  y="0"   width="320" height="52" rx="8" fill="#0d9488"/>
    <text x="160" y="34" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Xem sản phẩm</text>

    <rect x="48" y="64"  width="224" height="52" rx="8" fill="#14b8a6"/>
    <text x="160" y="98" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Thêm vào giỏ</text>

    <!-- điểm chảy máu -->
    <rect x="88" y="128" width="144" height="52" rx="8" fill="#dc2626"/>
    <text x="160" y="162" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Thanh toán</text>

    <rect x="116" y="192" width="88" height="52" rx="8" fill="#15803d"/>
    <text x="160" y="226" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Mua</text>

    <!-- drop % labels -->
    <text x="340" y="40"  fill="#94A3B8" font-size="15" font-weight="600">100%</text>
    <text x="340" y="104" fill="#94A3B8" font-size="15" font-weight="600">44%</text>
    <text x="340" y="168" fill="#FCA5A5" font-size="15" font-weight="700">33% ⚠ rò rỉ</text>
    <text x="340" y="232" fill="#94A3B8" font-size="15" font-weight="600">25%</text>

    <!-- leak marker -->
    <circle cx="232" cy="154" r="7" fill="#FCA5A5"/>
  </g>
</svg>
