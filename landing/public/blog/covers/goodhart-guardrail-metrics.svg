    <text x="105" y="23" fill="#7DD3FC" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">SERIES &#183; PHẦN 5</text>
  </g>
  <text x="80" y="216" fill="#F1F5F9" font-size="48" font-weight="800">Định luật Goodhart &amp; guardrail</text>
  <text x="80" y="268" fill="#94A3B8" font-size="25" font-weight="500">Ép một con số lên thường phá một con số khác —</text>
  <text x="80" y="302" fill="#94A3B8" font-size="25" font-weight="500">đặt lan can trước khi đạp ga.</text>
  <g transform="translate(80,350)">
