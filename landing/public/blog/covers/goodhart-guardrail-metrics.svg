    <line x1="0" y1="95" x2="1040" y2="95" stroke="#34D399" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="14" y="86" fill="#34D399" font-size="15" font-weight="700" letter-spacing="1">GUARDRAIL &#183; ngưỡng không được phá</text>
    <path d="M20 150 C 300 110, 600 60, 1010 24" fill="none" stroke="url(#up)" stroke-width="6"/>
    <circle cx="1010" cy="24" r="7" fill="#4ADE80"/>
    <text x="700" y="18" fill="#4ADE80" font-size="18" font-weight="700">KPI mục tiêu &#8593;</text>
