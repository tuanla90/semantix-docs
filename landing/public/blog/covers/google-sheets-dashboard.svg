<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar12" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg12)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="228" fill="#ffffff" font-size="50" font-weight="800">Từ Google Sheets</text>
  <text x="80" y="290" fill="#ffffff" font-size="50" font-weight="800">đến dashboard — 15 phút</text>
  <text x="80" y="344" fill="#CBD5E1" font-size="27" font-weight="600">Không data warehouse. Không SQL. Không thuê người.</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: spreadsheet grid -> arrow -> mini dashboard -->
  <g transform="translate(720,380)">
    <!-- spreadsheet -->
    <rect x="0" y="0" width="150" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="26" rx="10" fill="#15803D" opacity="0.85"/>
    <g stroke="#334155" stroke-width="1.5">
      <line x1="0" y1="52" x2="150" y2="52"/>
      <line x1="0" y1="78" x2="150" y2="78"/>
      <line x1="0" y1="104" x2="150" y2="104"/>
      <line x1="50" y1="26" x2="50" y2="120"/>
      <line x1="100" y1="26" x2="100" y2="120"/>
    </g>
    <g fill="#94A3B8">
      <rect x="8" y="36" width="34" height="7" rx="3"/>
      <rect x="58" y="36" width="34" height="7" rx="3"/>
      <rect x="108" y="36" width="30" height="7" rx="3"/>
      <rect x="8" y="62" width="34" height="7" rx="3"/>
      <rect x="58" y="62" width="34" height="7" rx="3"/>
      <rect x="108" y="62" width="30" height="7" rx="3"/>
      <rect x="8" y="88" width="34" height="7" rx="3"/>
      <rect x="58" y="88" width="34" height="7" rx="3"/>
      <rect x="108" y="88" width="30" height="7" rx="3"/>
    </g>

    <!-- arrow -->
    <g transform="translate(170,60)" stroke="url(#acc12)" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="0" y1="0" x2="58" y2="0"/>
      <polyline points="42,-14 60,0 42,14"/>
    </g>

    <!-- mini dashboard -->
    <g transform="translate(250,0)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
      <!-- bars -->
      <rect x="18" y="62" width="22" height="44" rx="3" fill="url(#bar12)"/>
      <rect x="50" y="42" width="22" height="64" rx="3" fill="url(#bar12)"/>
      <rect x="82" y="74" width="22" height="32" rx="3" fill="url(#bar12)"/>
      <!-- donut -->
      <circle cx="155" cy="58" r="30" fill="none" stroke="#312E81" stroke-width="12"/>
      <circle cx="155" cy="58" r="30" fill="none" stroke="#818CF8" stroke-width="12"
        stroke-dasharray="120 188" stroke-dashoffset="47" transform="rotate(-90 155 58)" stroke-linecap="round"/>
    </g>
  </g>
</svg>
