<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgqr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042F2E"/><stop offset="0.55" stop-color="#064E3B"/><stop offset="1" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgqr)"/>
  <g stroke="#0F766E" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="100" fill="#34D399" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <rect x="80" y="120" width="58" height="38" rx="19" fill="#0F766E"/>
  <text x="109" y="146" fill="#CCFBF1" font-size="19" font-weight="700" text-anchor="middle">2/4</text>
  <text x="156" y="146" fill="#5EEAD4" font-size="19" font-weight="700" letter-spacing="2">SERIES GROWTH ACCOUNTING</text>
  <text x="80" y="262" fill="#ffffff" font-size="62" font-weight="800">Quick Ratio</text>
  <text x="80" y="320" fill="#A7F3D0" font-size="30" font-weight="600">Nhịp tim của tăng trưởng</text>
  <text x="80" y="372" fill="#5EEAD4" font-size="22" font-weight="500" font-style="italic">(new + resurrected) / churned</text>
  <text x="80" y="524" fill="#5EEAD4" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: heartbeat Quick Ratio line crossing the 1,0 baseline -->
  <g transform="translate(700,315) scale(0.753)">
    <!-- baseline at 1.0 -->
    <line x1="0" y1="170" x2="440" y2="170" stroke="#FCD34D" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="446" y="176" fill="#FCD34D" font-size="18" font-weight="700">1,0</text>
    <!-- shaded zones -->
    <rect x="0" y="20" width="440" height="150" fill="#10B981" opacity="0.08"/>
    <rect x="0" y="170" width="440" height="150" fill="#EF4444" opacity="0.08"/>
    <text x="14" y="48" fill="#6EE7B7" font-size="16" font-weight="600">đang lớn</text>
    <text x="14" y="308" fill="#FCA5A5" font-size="16" font-weight="600">đang co</text>
    <!-- heartbeat QR line -->
    <path d="M0 150 L70 150 L100 110 L120 250 L150 70 L185 170 L230 160
             L270 165 L300 120 L325 235 L355 60 L390 170 L440 150"
          fill="none" stroke="#34D399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="355" cy="60" r="6" fill="#34D399"/>
  </g>
</svg>
