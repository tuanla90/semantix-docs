<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F87171"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="86" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <!-- series badge -->
  <g transform="translate(80,104)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="98" y="23" fill="#94A3B8" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SERIES · PHẦN 2</text>
  </g>
  <!-- title -->
  <text x="80" y="216" fill="#F1F5F9" font-size="50" font-weight="800">Lên Power BI &amp; Data Studio</text>
  <text x="80" y="268" fill="#94A3B8" font-size="26" font-weight="500">Dashboard đẹp, tự refresh, chia sẻ link —</text>
  <text x="80" y="302" fill="#94A3B8" font-size="26" font-weight="500">nhưng mỗi câu hỏi mới lại bị khóa cứng</text>
  <!-- LEFT: pretty dashboard -->
  <g transform="translate(80,346)">
    <rect x="0" y="0" width="470" height="190" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <text x="24" y="34" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">DASHBOARD ĐẸP</text>
    <!-- bar chart -->
    <g transform="translate(28,56)">
      <rect x="0" y="60" width="30" height="44" rx="3" fill="url(#bar)"/>
      <rect x="44" y="38" width="30" height="66" rx="3" fill="url(#bar)"/>
      <rect x="88" y="74" width="30" height="30" rx="3" fill="url(#bar)"/>
      <rect x="132" y="24" width="30" height="80" rx="3" fill="url(#bar)"/>
      <rect x="176" y="50" width="30" height="54" rx="3" fill="url(#bar)"/>
      <line x1="0" y1="104" x2="216" y2="104" stroke="#334155" stroke-width="1.5"/>
    </g>
    <!-- donut -->
    <g transform="translate(360,108)">
      <circle r="42" fill="none" stroke="#1E293B" stroke-width="16"/>
      <circle r="42" fill="none" stroke="#22D3EE" stroke-width="16" stroke-dasharray="160 264" transform="rotate(-90)"/>
      <circle r="42" fill="none" stroke="#34D399" stroke-width="16" stroke-dasharray="70 264" stroke-dashoffset="-160" transform="rotate(-90)"/>
    </g>
  </g>
  <!-- RIGHT: locked new question -->
  <g transform="translate(610,346)">
    <rect x="0" y="0" width="470" height="190" rx="14" fill="#0F172A" stroke="#7F1D1D" stroke-width="2"/>
    <text x="24" y="34" fill="#F87171" font-size="15" font-weight="700" letter-spacing="1">CÂU HỎI MỚI</text>
    <!-- question bubble -->
    <rect x="24" y="50" width="422" height="44" rx="12" fill="#1E293B"/>
    <text x="42" y="78" fill="#E2E8F0" font-size="16" font-weight="500">Sụt ở Đà Nẵng — ít khách hay mua ít hơn?</text>
    <!-- lock -->
    <g transform="translate(205,118)">
      <rect x="0" y="22" width="60" height="46" rx="8" fill="url(#lock)"/>
      <path d="M12 22 V12 a18 18 0 0 1 36 0 V22" fill="none" stroke="url(#lock)" stroke-width="7"/>
      <circle cx="30" cy="42" r="6" fill="#0B1120"/>
      <rect x="27" y="46" width="6" height="12" rx="3" fill="#0B1120"/>
    </g>
    <text x="235" y="180" fill="#F87171" font-size="14" font-weight="600" text-anchor="middle">nằm ngoài dashboard — phải nhờ người dựng</text>
  </g>
  <!-- footer -->
  <text x="80" y="576" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
