<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="serverface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#15263f"/>
    </linearGradient>
    <linearGradient id="freecyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="84" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <!-- series badge -->
  <g transform="translate(80,104)">
    <rect x="0" y="0" width="210" height="36" rx="18" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="105" y="24" fill="#7DD3FC" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SERIES · PHẦN 3</text>
  </g>
  <!-- title -->
  <text x="80" y="216" fill="#F1F5F9" font-size="48" font-weight="800">Sang Superset &amp; Metabase</text>
  <text x="80" y="266" fill="#94A3B8" font-size="26" font-weight="500">Tự chủ mã nguồn mở —</text>
  <text x="80" y="300" fill="#94A3B8" font-size="26" font-weight="500">và cái giá của tự do</text>
  <!-- illustration: self-host server with free badge + cost gears/clock -->
  <g transform="translate(80,348)">
    <!-- server rack -->
    <rect x="0" y="0" width="240" height="180" rx="14" fill="url(#serverface)" stroke="#2A4365" stroke-width="2"/>
    <text x="20" y="30" fill="#64748B" font-size="13" font-weight="700" letter-spacing="1">SERVER TỰ HOST</text>
    <!-- rack units -->
    <rect x="20" y="48" width="200" height="28" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="36" cy="62" r="5" fill="#4ADE80"/>
    <rect x="52" y="58" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="84" width="200" height="28" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="36" cy="98" r="5" fill="#22D3EE"/>
    <rect x="52" y="94" width="90" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="120" width="200" height="28" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="36" cy="134" r="5" fill="#FCA5A5"/>
    <rect x="52" y="130" width="140" height="8" rx="4" fill="#334155"/>
    <!-- free badge -->
    <g transform="translate(188,-18)">
      <circle r="34" fill="#16331f" stroke="url(#freecyan)" stroke-width="2.5"/>
      <text x="0" y="-2" fill="#86EFAC" font-size="17" font-weight="800" text-anchor="middle">0đ</text>
      <text x="0" y="16" fill="#4ADE80" font-size="10" font-weight="700" text-anchor="middle">LICENSE</text>
    </g>
  </g>
  <!-- cost side: gears + clock -->
  <g transform="translate(700,360)">
    <text x="0" y="-6" fill="#94A3B8" font-size="15" font-weight="700">chi phí vận hành ẩn</text>
    <!-- big gear -->
    <g transform="translate(120,90)" fill="#475569">
      <circle r="56" fill="#1E293B" stroke="#475569" stroke-width="3"/>
      <circle r="22" fill="#0B1120" stroke="#64748B" stroke-width="3"/>
      <rect x="-8" y="-72" width="16" height="20" rx="3"/>
      <rect x="-8" y="52" width="16" height="20" rx="3"/>
      <rect x="52" y="-8" width="20" height="16" rx="3"/>
      <rect x="-72" y="-8" width="20" height="16" rx="3"/>
      <rect x="36" y="-58" width="16" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-52" y="40" width="16" height="18" rx="3" transform="rotate(45)"/>
    </g>
    <!-- small gear -->
    <g transform="translate(208,150)" fill="#64748B">
      <circle r="36" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
      <circle r="14" fill="#0B1120" stroke="#94A3B8" stroke-width="2.5"/>
      <rect x="-6" y="-48" width="12" height="16" rx="3"/>
      <rect x="-6" y="32" width="12" height="16" rx="3"/>
      <rect x="32" y="-6" width="16" height="12" rx="3"/>
      <rect x="-48" y="-6" width="16" height="12" rx="3"/>
    </g>
    <!-- clock -->
    <g transform="translate(300,70)">
      <circle r="42" fill="#0F172A" stroke="#FCA5A5" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="20" y2="8" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
      <circle r="4" fill="#FCA5A5"/>
      <text x="0" y="68" fill="#FCA5A5" font-size="12" font-weight="700" text-anchor="middle">thời gian của bạn</text>
    </g>
  </g>
  <!-- footer -->
  <text x="80" y="572" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
