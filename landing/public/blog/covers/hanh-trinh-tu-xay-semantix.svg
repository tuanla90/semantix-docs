<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="86" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <!-- series badge -->
  <g transform="translate(80,104)">
    <rect x="0" y="0" width="290" height="34" rx="17" fill="#0B3B36" stroke="#34D399" stroke-width="1.5"/>
    <text x="20" y="23" fill="#A7F3D0" font-size="15" font-weight="700" letter-spacing="1">SERIES · PHẦN 4 (CUỐI)</text>
  </g>
  <!-- title -->
  <text x="80" y="206" fill="#F1F5F9" font-size="48" font-weight="800">Vì sao tôi tự xây Semantix</text>
  <text x="80" y="252" fill="#94A3B8" font-size="25" font-weight="500">Đứng trên vai Excel, Power BI, Superset —</text>
  <text x="80" y="284" fill="#94A3B8" font-size="25" font-weight="500">gom điểm mạnh, lấp đúng khoảng trống</text>
  <!-- three source pieces converging -->
  <g transform="translate(80,330)">
    <rect x="0" y="0" width="190" height="56" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="95" y="26" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Excel / Sheets</text>
    <text x="95" y="46" fill="#94A3B8" font-size="13" text-anchor="middle">tự do hỏi</text>
  </g>
  <g transform="translate(80,410)">
    <rect x="0" y="0" width="190" height="56" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="95" y="26" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Power BI</text>
    <text x="95" y="46" fill="#94A3B8" font-size="13" text-anchor="middle">mô hình hoá</text>
  </g>
  <g transform="translate(80,490)">
    <rect x="0" y="0" width="190" height="56" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="95" y="26" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Superset</text>
    <text x="95" y="46" fill="#94A3B8" font-size="13" text-anchor="middle">self-host</text>
  </g>
  <!-- converging arrows -->
  <path d="M270 358 C 400 358, 430 430, 560 442" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
  <path d="M270 438 L 560 446" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
  <path d="M270 518 C 400 518, 430 460, 560 450" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
  <!-- semantix core -->
  <rect x="560" y="392" width="220" height="110" rx="16" fill="#0B3B36" stroke="url(#core)" stroke-width="2.5"/>
  <text x="670" y="436" fill="#34D399" font-size="26" font-weight="800" text-anchor="middle">Semantix</text>
  <text x="670" y="464" fill="#A7F3D0" font-size="14" text-anchor="middle">semantic layer</text>
  <text x="670" y="484" fill="#A7F3D0" font-size="14" text-anchor="middle">+ AI tiếng Việt</text>
  <!-- output: question -> answer -->
  <path d="M780 447 L 850 447" fill="none" stroke="#34D399" stroke-width="3"/>
  <path d="M842 440 L 854 447 L 842 454 Z" fill="#34D399"/>
  <g transform="translate(860,400)">
    <rect x="0" y="0" width="260" height="44" rx="12" fill="#1E293B"/>
    <text x="20" y="29" fill="#E2E8F0" font-size="16" font-weight="500">Doanh thu Q7 giảm vì sao?</text>
    <rect x="0" y="54" width="260" height="44" rx="12" fill="#0F2A26" stroke="#34D399" stroke-width="1.5"/>
    <text x="20" y="83" fill="#34D399" font-size="16" font-weight="700">→ AOV ↓ 12%, đơn ổn định</text>
  </g>
  <!-- footer -->
  <text x="80" y="576" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
