<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <marker id="arrow11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg11)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="210" fill="#ffffff" font-size="50" font-weight="800">Hợp nhất đa kênh</text>
  <text x="80" y="270" fill="#CBD5E1" font-size="28" font-weight="600">Shopee · TikTok Shop · KiotViet → một nguồn sự thật</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: 3 rời rạc nguồn hội tụ về một khối -->
  <g transform="translate(760,310)">
    <!-- arrows from sources to hub -->
    <g stroke="#818CF8" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M120 -90 C 200 -70, 230 -30, 268 -8" marker-end="url(#arrow11)"/>
      <path d="M110 10 L 262 10" marker-end="url(#arrow11)"/>
      <path d="M120 110 C 200 90, 230 50, 268 28" marker-end="url(#arrow11)"/>
    </g>

    <!-- source 1: Shopee -->
    <g transform="translate(0,-118)">
      <rect x="0" y="0" width="118" height="56" rx="12" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="59" y="35" fill="#FB923C" font-size="20" font-weight="700" text-anchor="middle">Shopee</text>
    </g>
    <!-- source 2: TikTok Shop -->
    <g transform="translate(0,-18)">
      <rect x="0" y="0" width="118" height="56" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="59" y="28" fill="#67E8F9" font-size="16" font-weight="700" text-anchor="middle">TikTok</text>
      <text x="59" y="46" fill="#67E8F9" font-size="16" font-weight="700" text-anchor="middle">Shop</text>
    </g>
    <!-- source 3: KiotViet -->
    <g transform="translate(0,82)">
      <rect x="0" y="0" width="118" height="56" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
      <text x="59" y="35" fill="#6EE7B7" font-size="20" font-weight="700" text-anchor="middle">KiotViet</text>
    </g>

    <!-- hub: một nguồn sự thật -->
    <g transform="translate(280,-52)">
      <rect x="0" y="0" width="150" height="104" rx="18" fill="url(#acc11)"/>
      <text x="75" y="44" fill="#ffffff" font-size="19" font-weight="800" text-anchor="middle">MỘT NGUỒN</text>
      <text x="75" y="70" fill="#E0E7FF" font-size="19" font-weight="800" text-anchor="middle">SỰ THẬT</text>
    </g>
  </g>
</svg>
