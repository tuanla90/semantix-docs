<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgPt054" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrPt054" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgPt054)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Input vs Output</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="28" font-weight="600">Nút bấm lái được → kết quả</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: input buttons (controllable) -> arrow -> output gauge (result) -->
  <g transform="translate(720,178)">
    <!-- input buttons -->
    <rect x="0" y="0" width="168" height="46" rx="10" fill="#1E293B" stroke="#818CF8"/>
    <text x="84" y="29" fill="#E2E8F0" font-size="17" text-anchor="middle">Khách tư vấn</text>
    <rect x="0" y="74" width="168" height="46" rx="10" fill="#1E293B" stroke="#818CF8"/>
    <text x="84" y="103" fill="#E2E8F0" font-size="17" text-anchor="middle">Tốc độ giao</text>
    <rect x="0" y="148" width="168" height="46" rx="10" fill="#1E293B" stroke="#818CF8"/>
    <text x="84" y="177" fill="#E2E8F0" font-size="17" text-anchor="middle">Bổ sung hàng</text>
    <text x="84" y="218" fill="#818CF8" font-size="15" font-weight="700" text-anchor="middle">INPUT • lái được</text>
    <!-- arrows converging toward output -->
    <path d="M174 23 C260 23 270 95 330 100" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arrPt054)"/>
    <path d="M174 97 L330 100" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arrPt054)"/>
    <path d="M174 171 C260 171 270 105 330 100" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arrPt054)"/>
    <!-- output gauge (result) -->
    <circle cx="416" cy="100" r="62" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <path d="M375 122 A50 50 0 0 1 457 122" stroke="#334155" stroke-width="8" fill="none"/>
    <path d="M375 122 A50 50 0 0 1 440 70" stroke="#4ADE80" stroke-width="8" fill="none"/>
    <line x1="416" y1="100" x2="445" y2="78" stroke="#4ADE80" stroke-width="3"/>
    <circle cx="416" cy="100" r="5" fill="#4ADE80"/>
    <text x="416" y="158" fill="#94A3B8" font-size="15" text-anchor="middle">Doanh thu</text>
    <text x="416" y="200" fill="#4ADE80" font-size="15" font-weight="700" text-anchor="middle">OUTPUT • kết quả</text>
  </g>
</svg>
