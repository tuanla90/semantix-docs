<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bghd014" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acchd014" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bghd014)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="228" fill="#ffffff" font-size="50" font-weight="800">Khi nào rời Google Sheets</text>
  <text x="80" y="290" fill="#ffffff" font-size="50" font-weight="800">lên database</text>
  <text x="80" y="344" fill="#CBD5E1" font-size="27" font-weight="600">5 dấu hiệu bảng tính đã quá tải — &amp; đường lên nhẹ nhất</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: overloaded spreadsheet -> arrow up -> tidy database -->
  <g transform="translate(770,378)">
    <!-- overloaded spreadsheet -->
    <rect x="0" y="0" width="150" height="124" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="24" rx="10" fill="#15803D" opacity="0.85"/>
    <g stroke="#334155" stroke-width="1.5">
      <line x1="0" y1="50" x2="150" y2="50"/>
      <line x1="0" y1="74" x2="150" y2="74"/>
      <line x1="0" y1="98" x2="150" y2="98"/>
      <line x1="50" y1="24" x2="50" y2="124"/>
      <line x1="100" y1="24" x2="100" y2="124"/>
    </g>
    <g fill="#94A3B8">
      <rect x="8" y="34" width="34" height="7" rx="3"/>
      <rect x="58" y="34" width="34" height="7" rx="3"/>
      <rect x="108" y="34" width="30" height="7" rx="3"/>
      <rect x="8" y="58" width="34" height="7" rx="3"/>
      <rect x="58" y="58" width="34" height="7" rx="3"/>
      <rect x="8" y="82" width="34" height="7" rx="3"/>
      <rect x="108" y="82" width="30" height="7" rx="3"/>
    </g>
    <!-- error markers: overload -->
    <rect x="58" y="80" width="34" height="11" rx="3" fill="#EF4444" opacity="0.85"/>
    <rect x="108" y="56" width="30" height="11" rx="3" fill="#EF4444" opacity="0.85"/>
    <circle cx="150" cy="0" r="13" fill="#EF4444"/>
    <text x="150" y="5" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">!</text>
    <!-- arrow up to database -->
    <g transform="translate(186,62)" stroke="url(#acchd014)" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="0" y1="0" x2="58" y2="0"/>
      <polyline points="42,-14 60,0 42,14"/>
    </g>
    <!-- tidy database cylinder -->
    <g transform="translate(258,8)">
      <rect x="0" y="18" width="120" height="92" rx="4" fill="#0B1220" stroke="#4ADE80" stroke-width="2" opacity="0.25"/>
      <ellipse cx="60" cy="20" rx="56" ry="16" fill="#1E293B" stroke="#4ADE80" stroke-width="2"/>
      <path d="M4 20 V92 a56 16 0 0 0 112 0 V20" fill="#1E293B" stroke="#4ADE80" stroke-width="2"/>
      <path d="M4 52 a56 16 0 0 0 112 0" fill="none" stroke="#334155" stroke-width="1.5"/>
      <path d="M4 80 a56 16 0 0 0 112 0" fill="none" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="60" cy="20" rx="56" ry="16" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <circle cx="22" cy="16" r="3" fill="#4ADE80"/>
      <text x="60" y="118" fill="#4ADE80" font-size="15" font-weight="700" text-anchor="middle">database</text>
    </g>
  </g>
</svg>
