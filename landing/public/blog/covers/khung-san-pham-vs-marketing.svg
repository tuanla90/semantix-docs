<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt046" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lanept046" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="arrpt046" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#4ADE80"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt046)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Sản phẩm &amp; Marketing</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="29" font-weight="600">Một hành trình, nhiều ngôn ngữ</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: two lanes (marketing & product) converge into one shared journey -->
  <g transform="translate(620,150)">
    <!-- lane 1: marketing -->
    <rect x="0" y="20" width="200" height="44" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="47" fill="#818CF8" font-size="15" font-weight="700">Marketing</text>
    <text x="118" y="47" fill="#94A3B8" font-size="13">AIDA · 5A</text>
    <!-- lane 2: product -->
    <rect x="0" y="116" width="200" height="44" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="143" fill="#7DD3FC" font-size="15" font-weight="700">Sản phẩm</text>
    <text x="118" y="143" fill="#94A3B8" font-size="13">AARRR · HEART</text>
    <!-- converging arrows into one journey -->
    <path d="M206 42 C285 42 285 90 360 90" stroke="#818CF8" stroke-width="3" fill="none"/>
    <path d="M206 138 C285 138 285 90 360 90" stroke="#7DD3FC" stroke-width="3" fill="none"/>
    <!-- shared journey bar -->
    <rect x="360" y="62" width="190" height="56" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="455" y="86" fill="#4ADE80" font-size="17" font-weight="700" text-anchor="middle">1 hành trình</text>
    <text x="455" y="108" fill="#94A3B8" font-size="14" text-anchor="middle">1 bản đồ chung</text>
    <!-- onward arrow -->
    <path d="M362 90 L356 90" stroke="#4ADE80" stroke-width="3" fill="none" marker-end="url(#arrpt046)"/>
    <!-- journey dots under the shared bar -->
    <g transform="translate(372,140)">
      <circle cx="0" cy="0" r="8" fill="#818CF8"/>
      <circle cx="42" cy="0" r="8" fill="#7DD3FC"/>
      <circle cx="84" cy="0" r="8" fill="#A78BFA"/>
      <circle cx="126" cy="0" r="8" fill="#34D399"/>
      <circle cx="168" cy="0" r="8" fill="#4ADE80"/>
      <line x1="8" y1="0" x2="34" y2="0" stroke="#475569" stroke-width="2"/>
      <line x1="50" y1="0" x2="76" y2="0" stroke="#475569" stroke-width="2"/>
      <line x1="92" y1="0" x2="118" y2="0" stroke="#475569" stroke-width="2"/>
      <line x1="134" y1="0" x2="160" y2="0" stroke="#475569" stroke-width="2"/>
    </g>
  </g>
</svg>
