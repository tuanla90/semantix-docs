<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="a14" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg14)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Title block -->
  <text x="80" y="138" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="222" fill="#ffffff" font-size="52" font-weight="800">Khi AI "bịa" ra SQL</text>
  <text x="80" y="284" fill="#CBD5E1" font-size="28" font-weight="600">Ảo giác của LLM — và 5 tuyến chặn</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: SQL block with hallucinated column (red) -->
  <g transform="translate(640,170)">
    <rect x="0" y="0" width="360" height="210" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="18" y="42" fill="#7DD3FC" font-size="20" font-family="monospace">SELECT</text>
    <text x="108" y="42" fill="#FCA5A5" font-size="20" font-family="monospace">customer_ltv</text>
    <text x="18" y="74" fill="#7DD3FC" font-size="20" font-family="monospace">FROM</text>
    <text x="92" y="74" fill="#FCA5A5" font-size="20" font-family="monospace">transactions</text>
    <text x="18" y="106" fill="#7DD3FC" font-size="20" font-family="monospace">WHERE</text>
    <text x="100" y="106" fill="#E2E8F0" font-size="20" font-family="monospace">segment='VIP'</text>
    <!-- red markers on hallucinated refs -->
    <rect x="100" y="26" width="172" height="24" rx="4" fill="none" stroke="#EF4444" stroke-width="2"/>
    <rect x="84" y="58" width="170" height="24" rx="4" fill="none" stroke="#EF4444" stroke-width="2"/>
    <text x="18" y="152" fill="#EF4444" font-size="16" font-family="monospace">✗ cột / bảng KHÔNG tồn tại</text>
    <text x="18" y="180" fill="#94A3B8" font-size="15" font-family="monospace">-- đúng cú pháp, vẫn là bịa</text>
  </g>

  <!-- arrow into shield -->
  <path d="M1010 275 L1058 275" stroke="#818CF8" stroke-width="3" marker-end="url(#a14)"/>

  <!-- shield / filter layers blocking -->
  <g transform="translate(1070,180)">
    <path d="M48 0 L96 18 L96 92 C96 138 48 168 48 168 C48 168 0 138 0 92 L0 18 Z"
          fill="#13203A" stroke="#34D399" stroke-width="3"/>
    <line x1="14" y1="52" x2="82" y2="52" stroke="#34D399" stroke-width="2" opacity="0.7"/>
    <line x1="14" y1="84" x2="82" y2="84" stroke="#34D399" stroke-width="2" opacity="0.7"/>
    <line x1="14" y1="116" x2="82" y2="116" stroke="#34D399" stroke-width="2" opacity="0.7"/>
    <path d="M30 84 L44 100 L70 64" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1070" y="372" fill="#34D399" font-size="16" font-weight="700" letter-spacing="1">5 TẦNG CHẶN</text>
</svg>
