<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bguc006" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accuc006" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="coreuc006" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </radialGradient>
    <marker id="arrowuc006" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bguc006)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <text x="80" y="208" fill="#ffffff" font-size="46" font-weight="800">Đo ROI quảng cáo</text>
  <text x="80" y="262" fill="#CBD5E1" font-size="26" font-weight="600">Mỗi kênh đều báo bạn lãi — cả ba không thể cùng đúng</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: ba kênh ads tự nhận công -> một con số ROI thật ở giữa -->
  <g transform="translate(720,400) scale(0.792)">
    <!-- three channels each claiming credit -->
    <g transform="translate(-40,-130)">
      <rect x="0" y="0" width="118" height="40" rx="10" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
      <text x="59" y="26" fill="#93C5FD" font-size="16" font-weight="700" text-anchor="middle">Facebook</text>
      <text x="59" y="58" fill="#64748B" font-size="13" font-weight="600" text-anchor="middle">ROAS 4,2</text>
    </g>
    <g transform="translate(190,-130)">
      <rect x="0" y="0" width="118" height="40" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="59" y="26" fill="#67E8F9" font-size="16" font-weight="700" text-anchor="middle">TikTok</text>
      <text x="59" y="58" fill="#64748B" font-size="13" font-weight="600" text-anchor="middle">ROAS 3,8</text>
    </g>
    <g transform="translate(420,-130)">
      <rect x="0" y="0" width="118" height="40" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
      <text x="59" y="26" fill="#FCD34D" font-size="16" font-weight="700" text-anchor="middle">Google</text>
      <text x="59" y="58" fill="#64748B" font-size="13" font-weight="600" text-anchor="middle">ROAS 5,1</text>
    </g>

    <!-- converging arrows to the single truth -->
    <g stroke="#818CF8" stroke-width="2.2" fill="none" opacity="0.8">
      <path d="M20 -72 C 100 -10, 200 20, 235 58" marker-end="url(#arrowuc006)"/>
      <path d="M249 -72 L 249 50" marker-end="url(#arrowuc006)"/>
      <path d="M480 -72 C 400 -10, 300 20, 263 58" marker-end="url(#arrowuc006)"/>
    </g>

    <!-- one true ROI core -->
    <g transform="translate(170,70)">
      <circle cx="80" cy="55" r="72" fill="url(#coreuc006)"/>
      <circle cx="80" cy="55" r="72" fill="none" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
      <text x="80" y="44" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">ROI THẬT</text>
      <text x="80" y="76" fill="#E0E7FF" font-size="14" font-weight="700" text-anchor="middle">1 con số</text>
    </g>
  </g>
</svg>
