<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="88" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <!-- series badge -->
  <g transform="translate(80,108)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="98" y="23" fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">SERIES &#183; PHẦN 1</text>
  </g>
  <!-- title -->
  <text x="80" y="216" fill="#F1F5F9" font-size="50" font-weight="800">Mẫu &amp; tổng thể</text>
  <text x="80" y="268" fill="#94A3B8" font-size="26" font-weight="500">Bao nhiêu là đủ để tin? —</text>
  <text x="80" y="302" fill="#94A3B8" font-size="26" font-weight="500">vì sao 3 khách khen chưa nói lên điều gì</text>
  <!-- LEFT: small sample, a few dots -->
  <g transform="translate(150,440)">
    <text x="0" y="-58" fill="#64748B" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">MẪU NHỎ</text>
    <circle cx="-44" cy="-10" r="11" fill="url(#dot)"/>
    <circle cx="0" cy="14" r="11" fill="url(#dot)"/>
    <circle cx="40" cy="-22" r="11" fill="url(#dot)"/>
    <text x="0" y="62" fill="#94A3B8" font-size="15" text-anchor="middle">vài người bạn nghe được</text>
  </g>
  <!-- arrow -->
  <g transform="translate(420,400)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="3"/>
    <path d="M72 -8 L88 0 L72 8 Z" fill="#475569"/>
    <text x="44" y="-16" fill="#64748B" font-size="14" text-anchor="middle">suy ra?</text>
  </g>
  <!-- RIGHT: population, a dense crowd of dots -->
  <g transform="translate(560,330)">
    <text x="300" y="-12" fill="#64748B" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">TỔNG THỂ</text>
    <g fill="#334155">
      <circle cx="20" cy="20" r="9"/><circle cx="58" cy="14" r="9"/><circle cx="96" cy="24" r="9"/><circle cx="134" cy="12" r="9"/><circle cx="172" cy="26" r="9"/><circle cx="210" cy="16" r="9"/><circle cx="248" cy="22" r="9"/><circle cx="286" cy="14" r="9"/><circle cx="324" cy="24" r="9"/><circle cx="362" cy="16" r="9"/><circle cx="400" cy="22" r="9"/><circle cx="438" cy="14" r="9"/><circle cx="476" cy="24" r="9"/><circle cx="514" cy="18" r="9"/>
      <circle cx="38" cy="56" r="9"/><circle cx="76" cy="50" r="9"/><circle cx="114" cy="60" r="9"/><circle cx="152" cy="48" r="9"/><circle cx="190" cy="58" r="9"/><circle cx="228" cy="52" r="9"/><circle cx="266" cy="58" r="9"/><circle cx="304" cy="50" r="9"/><circle cx="342" cy="60" r="9"/><circle cx="380" cy="52" r="9"/><circle cx="418" cy="58" r="9"/><circle cx="456" cy="50" r="9"/><circle cx="494" cy="56" r="9"/>
      <circle cx="20" cy="92" r="9"/><circle cx="58" cy="86" r="9"/><circle cx="96" cy="96" r="9"/><circle cx="134" cy="84" r="9"/><circle cx="172" cy="94" r="9"/><circle cx="210" cy="88" r="9"/><circle cx="248" cy="94" r="9"/><circle cx="286" cy="86" r="9"/><circle cx="324" cy="96" r="9"/><circle cx="362" cy="88" r="9"/><circle cx="400" cy="94" r="9"/><circle cx="438" cy="86" r="9"/><circle cx="476" cy="96" r="9"/><circle cx="514" cy="90" r="9"/>
    </g>
    <!-- a few highlighted = the sample inside the population -->
    <circle cx="190" cy="58" r="9" fill="url(#dot)"/>
    <circle cx="324" cy="24" r="9" fill="url(#dot)"/>
    <circle cx="96" cy="96" r="9" fill="url(#dot)"/>
    <text x="300" y="138" fill="#94A3B8" font-size="15" text-anchor="middle">cả thị trường — thứ bạn thật sự muốn hiểu</text>
  </g>
  <!-- footer -->
  <text x="80" y="568" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
