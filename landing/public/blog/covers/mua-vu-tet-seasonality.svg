<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- series badge -->
  <g transform="translate(80,112)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#0B1120" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="98" y="23" fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SERIES &#183; PHẦN 2</text>
  </g>
  <!-- title -->
  <text x="80" y="208" fill="#F1F5F9" font-size="48" font-weight="800">Mùa vụ &amp; Tết</text>
  <text x="80" y="258" fill="#94A3B8" font-size="25" font-weight="500">Đọc seasonality để không vừa cháy hàng</text>
  <text x="80" y="290" fill="#94A3B8" font-size="25" font-weight="500">vừa ôm tồn kho</text>
  <!-- chart: revenue line with repeating Tet peaks -->
  <g transform="translate(80,330)">
    <rect x="0" y="0" width="1040" height="190" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <text x="24" y="34" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">DOANH THU THEO THÁNG &#8212; ĐỈNH TẾT LẶP QUA CÁC NĂM</text>
    <!-- baseline -->
    <line x1="40" y1="150" x2="1000" y2="150" stroke="#334155" stroke-width="1.5"/>
    <!-- filled area under curve -->
    <path d="M40 132 L120 120 L200 64 L280 122 L360 128 L440 116 L520 58 L600 120 L680 126 L760 110 L840 50 L920 116 L1000 122 L1000 150 L40 150 Z" fill="url(#area)"/>
    <!-- the revenue line, three Tet spikes -->
    <path d="M40 132 L120 120 L200 64 L280 122 L360 128 L440 116 L520 58 L600 120 L680 126 L760 110 L840 50 L920 116 L1000 122" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- peak markers -->
    <circle cx="200" cy="64" r="6" fill="#22D3EE"/>
    <circle cx="520" cy="58" r="6" fill="#22D3EE"/>
    <circle cx="840" cy="50" r="6" fill="#22D3EE"/>
    <!-- peak labels -->
    <text x="200" y="48" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">Tết &#8217;24</text>
    <text x="520" y="42" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">Tết &#8217;25</text>
    <text x="840" y="34" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">Tết &#8217;26</text>
    <!-- year axis -->
    <text x="200" y="172" fill="#64748B" font-size="13" text-anchor="middle">2024</text>
    <text x="520" y="172" fill="#64748B" font-size="13" text-anchor="middle">2025</text>
    <text x="840" y="172" fill="#64748B" font-size="13" text-anchor="middle">2026</text>
  </g>
  <!-- footer -->
  <text x="80" y="568" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX &#8226; BLOG</text>
</svg>
