<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="150" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="245" fill="#ffffff" font-size="56" font-weight="800">BYOK</text>
  <text x="80" y="318" fill="#CBD5E1" font-size="34" font-weight="600">Chìa khoá trong tay bạn.</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: ổ định tuyến tới nhiều nhà cung cấp + chìa khoá của bạn -->
  <g transform="translate(700,150)">
    <!-- chìa khoá (key) của bạn -->
    <g transform="translate(0,118)">
      <circle cx="22" cy="22" r="22" fill="none" stroke="url(#accent)" stroke-width="7"/>
      <circle cx="22" cy="22" r="8" fill="#0F172A"/>
      <rect x="42" y="16" width="74" height="12" rx="3" fill="url(#accent)"/>
      <rect x="98" y="28" width="12" height="16" rx="2" fill="url(#accent)"/>
      <rect x="78" y="28" width="10" height="13" rx="2" fill="url(#accent)"/>
    </g>

    <!-- bộ định tuyến trung tâm -->
    <rect x="128" y="98" width="150" height="84" rx="16" fill="url(#accent)"/>
    <text x="203" y="135" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">SEMANTIX</text>
    <text x="203" y="160" fill="#C7D2FE" font-size="15" font-weight="600" text-anchor="middle" font-family="monospace">router</text>
    <path d="M118 140 L126 140" stroke="#818CF8" stroke-width="4"/>

    <!-- ba nhánh tới ba nhà cung cấp -->
    <path d="M278 116 C 330 80, 360 60, 410 56" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ar)"/>
    <path d="M278 140 L 410 140" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ar)"/>
    <path d="M278 164 C 330 200, 360 220, 410 224" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ar)"/>

    <g font-family="monospace">
      <rect x="412" y="34" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="432" y="63" fill="#94A3B8" font-size="20">Claude</text>
      <rect x="412" y="117" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="432" y="146" fill="#94A3B8" font-size="20">GPT</text>
      <rect x="412" y="200" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="432" y="229" fill="#94A3B8" font-size="20">on-prem</text>
    </g>
  </g>
</svg>
