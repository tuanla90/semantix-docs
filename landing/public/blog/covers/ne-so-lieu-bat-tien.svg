<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt055" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="badpt055" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt055)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Né số liệu bất tiện</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="28" font-weight="600">Có data rõ &amp; quyết định không đổi</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: an inconvenient red bar that everyone waves away / turns from -->
  <g transform="translate(760,150)">
    <!-- mini chart: green bars rising, one red bar spiking down (the inconvenient number) -->
    <line x1="0" y1="200" x2="340" y2="200" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="150" width="40" height="50" rx="4" fill="#4ADE80" opacity="0.85"/>
    <rect x="80" y="120" width="40" height="80" rx="4" fill="#4ADE80" opacity="0.85"/>
    <rect x="140" y="100" width="40" height="100" rx="4" fill="#4ADE80" opacity="0.85"/>
    <!-- the inconvenient red bar plunging below the axis -->
    <rect x="200" y="200" width="40" height="118" rx="4" fill="url(#badpt055)"/>
    <text x="220" y="350" fill="#F87171" font-size="22" font-weight="800" text-anchor="middle">−1,2 tỷ</text>
    <rect x="260" y="160" width="40" height="40" rx="4" fill="#4ADE80" opacity="0.4"/>
    <!-- hand waving the red bar away -->
    <g transform="translate(300,70)" stroke="#94A3B8" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M0 60 L48 60"/>
      <path d="M0 78 L40 78"/>
      <path d="M0 42 L40 42"/>
      <path d="M48 60 q26 -2 26 -24"/>
      <path d="M40 78 q22 0 26 -18"/>
    </g>
    <!-- a turned-away face: profile looking the other direction -->
    <g transform="translate(360,250)" stroke="#64748B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 0 q-30 6 -30 40 q0 34 30 40 q-8 -14 -8 -40 q0 -26 8 -40"/>
      <circle cx="10" cy="36" r="3.5" fill="#64748B" stroke="none"/>
    </g>
  </g>
</svg>
