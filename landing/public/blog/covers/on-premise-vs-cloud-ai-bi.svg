<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgai008" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bldgai008" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgai008)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="228" fill="#ffffff" font-size="52" font-weight="800">On-premise vs Cloud</text>
  <text x="80" y="292" fill="#CBD5E1" font-size="29" font-weight="600">Khi dữ liệu không được rời máy chủ</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: left = cloud (data leaves), right = on-premise building (data stays) -->
  <g transform="translate(720,165)">
    <!-- LEFT: cloud, data going out -->
    <g transform="translate(0,30)">
      <path d="M30 120 a40 40 0 0 1 10 -78 a52 52 0 0 1 98 -8 a36 36 0 0 1 30 86 Z" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <text x="98" y="96" fill="#94A3B8" font-size="20" font-weight="700" text-anchor="middle">CLOUD</text>
      <!-- data leaving upward -->
      <rect x="74" y="150" width="16" height="16" rx="3" fill="#7DD3FC"/>
      <rect x="98" y="168" width="16" height="16" rx="3" fill="#475569"/>
      <rect x="60" y="176" width="16" height="16" rx="3" fill="#64748B"/>
      <path d="M88 150 L98 120" stroke="#7DD3FC" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/>
      <text x="98" y="218" fill="#64748B" font-size="16" text-anchor="middle">data ra ngoài</text>
    </g>
    <!-- divider -->
    <line x1="232" y1="20" x2="232" y2="250" stroke="#312E81" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="232" y="14" fill="#818CF8" font-size="18" font-weight="700" text-anchor="middle">vs</text>
    <!-- RIGHT: on-premise building, data stays inside -->
    <g transform="translate(290,30)">
      <rect x="0" y="40" width="170" height="160" rx="8" fill="url(#bldgai008)" stroke="#4ADE80" stroke-width="2"/>
      <!-- server racks inside -->
      <rect x="22" y="64" width="126" height="22" rx="4" fill="#0B1220" stroke="#334155"/>
      <circle cx="36" cy="75" r="4" fill="#4ADE80"/>
      <rect x="22" y="96" width="126" height="22" rx="4" fill="#0B1220" stroke="#334155"/>
      <circle cx="36" cy="107" r="4" fill="#4ADE80"/>
      <rect x="22" y="128" width="126" height="22" rx="4" fill="#0B1220" stroke="#334155"/>
      <circle cx="36" cy="139" r="4" fill="#7DD3FC"/>
      <!-- AI chip inside -->
      <rect x="58" y="160" width="54" height="26" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="85" y="178" fill="#818CF8" font-size="15" font-weight="700" text-anchor="middle">AI</text>
      <text x="85" y="222" fill="#4ADE80" font-size="16" font-weight="700" text-anchor="middle">data ở trong nhà</text>
    </g>
  </g>
</svg>
