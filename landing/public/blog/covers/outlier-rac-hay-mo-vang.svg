    <rect x="120" y="120" width="360" height="50" rx="10" fill="#162033" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="130" y="112" fill="#22D3EE" font-size="13" font-weight="700">đám điểm bình thường</text>
    <circle cx="150" cy="158" r="6" fill="#34D399"/>
    <circle cx="185" cy="148" r="6" fill="#34D399"/>
    <circle cx="220" cy="160" r="6" fill="#34D399"/>
    <circle cx="255" cy="142" r="6" fill="#34D399"/>
    <circle cx="290" cy="155" r="6" fill="#34D399"/>
    <circle cx="325" cy="147" r="6" fill="#34D399"/>
    <circle cx="360" cy="162" r="6" fill="#34D399"/>
    <circle cx="395" cy="150" r="6" fill="#34D399"/>
    <circle cx="430" cy="158" r="6" fill="#34D399"/>
    <circle cx="465" cy="145" r="6" fill="#34D399"/>
    <circle cx="760" cy="80" r="38" fill="url(#goldGlow)"/>
