    <text x="760" y="124" fill="#94A3B8" font-size="13" text-anchor="middle">khách sỉ 200tr &amp; thật</text>
    <circle cx="940" cy="100" r="13" fill="#F87171" stroke="#F1F5F9" stroke-width="2.5"/>
