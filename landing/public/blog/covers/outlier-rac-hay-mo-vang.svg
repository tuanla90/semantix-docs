  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="162" fill="#F1F5F9" font-size="48" font-weight="800">Outlier: rác cần bỏ,</text>
  <text x="80" y="216" fill="#F1F5F9" font-size="48" font-weight="800">hay mỏ vàng cần giữ?</text>
  <text x="80" y="262" fill="#94A3B8" font-size="24" font-weight="500">Xoá điểm lệch &quot;cho đẹp số&quot; — và xoá luôn insight đắt nhất</text>
  <g transform="translate(70,310)">
    <rect x="0" y="0" width="1060" height="220" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <line x1="40" y1="180" x2="1020" y2="180" stroke="#334155" stroke-width="1.5"/>
