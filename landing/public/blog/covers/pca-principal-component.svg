<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt048" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="apt048" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt048)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">PCA — Giảm chiều</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">15 chỉ số &amp; nén còn 2 trục</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: many metric arrows compress into 2 axes + clusters -->
  <g transform="translate(700,150)">
    <!-- bundle of many metric arrows on the left -->
    <g stroke="#475569" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M0 20 L150 130" marker-end="url(#apt048)"/>
      <path d="M0 60 L150 135" marker-end="url(#apt048)"/>
      <path d="M0 100 L150 140" marker-end="url(#apt048)"/>
      <path d="M0 140 L150 145" marker-end="url(#apt048)"/>
      <path d="M0 180 L150 150" marker-end="url(#apt048)"/>
      <path d="M0 220 L150 155" marker-end="url(#apt048)"/>
      <path d="M0 260 L150 160" marker-end="url(#apt048)"/>
    </g>
    <text x="-6" y="14" fill="#64748B" font-size="16" text-anchor="end">15 chỉ số</text>
    <!-- the 2-axis target (PC1 / PC2) with cluster of points -->
    <g transform="translate(190,30)">
      <line x1="0" y1="220" x2="270" y2="220" stroke="#818CF8" stroke-width="3" marker-end="url(#apt048)"/>
      <line x1="0" y1="220" x2="0" y2="0" stroke="#818CF8" stroke-width="3" marker-end="url(#apt048)"/>
      <text x="276" y="244" fill="#A5B4FC" font-size="17" font-weight="700">PC1</text>
      <text x="-6" y="-6" fill="#A5B4FC" font-size="17" font-weight="700" text-anchor="middle">PC2</text>
      <!-- cluster green -->
      <circle cx="50" cy="70" r="9" fill="#10b981"/>
      <circle cx="68" cy="58" r="9" fill="#10b981"/>
      <circle cx="42" cy="90" r="9" fill="#10b981"/>
      <circle cx="64" cy="84" r="9" fill="#10b981"/>
      <!-- cluster indigo -->
      <circle cx="210" cy="64" r="9" fill="#6366f1"/>
      <circle cx="228" cy="78" r="9" fill="#6366f1"/>
      <circle cx="200" cy="86" r="9" fill="#6366f1"/>
      <circle cx="222" cy="56" r="9" fill="#6366f1"/>
      <!-- cluster amber -->
      <circle cx="128" cy="178" r="9" fill="#f59e0b"/>
      <circle cx="146" cy="166" r="9" fill="#f59e0b"/>
      <circle cx="120" cy="160" r="9" fill="#f59e0b"/>
      <circle cx="142" cy="184" r="9" fill="#f59e0b"/>
    </g>
  </g>
</svg>
