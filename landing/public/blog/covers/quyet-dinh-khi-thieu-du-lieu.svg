<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="84" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <!-- series badge -->
  <g transform="translate(80,104)">
    <rect x="0" y="0" width="262" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="131" y="23" fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">SERIES &#183; PHẦN 6 (CUỐI)</text>
  </g>
  <!-- title -->
  <text x="80" y="214" fill="#F1F5F9" font-size="50" font-weight="800">Quyết định khi dữ liệu</text>
  <text x="80" y="272" fill="#F1F5F9" font-size="50" font-weight="800">chưa đủ</text>
  <text x="80" y="320" fill="#94A3B8" font-size="25" font-weight="500">Chờ dữ liệu hoàn hảo cũng là một quyết định —</text>
  <text x="80" y="352" fill="#94A3B8" font-size="25" font-weight="500">và thường là quyết định tệ nhất.</text>
  <!-- LEFT: data progress bar ~70% + decide button -->
  <g transform="translate(80,400)">
    <text x="0" y="14" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">DỮ LIỆU NẮM ĐƯỢC</text>
    <rect x="0" y="28" width="430" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <rect x="3" y="31" width="298" height="24" rx="12" fill="url(#prog)"/>
    <line x1="301" y1="20" x2="301" y2="66" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="301" y="84" fill="#34D399" font-size="16" font-weight="800" text-anchor="middle">~70%</text>
    <text x="430" y="84" fill="#475569" font-size="14" text-anchor="end">100%</text>
    <!-- decide button -->
    <g transform="translate(0,108)">
      <rect x="0" y="0" width="200" height="56" rx="12" fill="url(#btn)"/>
      <text x="100" y="36" fill="#06283D" font-size="22" font-weight="800" text-anchor="middle">Quyết định ▶</text>
    </g>
  </g>
  <!-- RIGHT: wait-forever spiral -->
  <g transform="translate(880,460)">
    <circle r="118" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M0 -96 A96 96 0 1 1 -68 68" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M-68 68 A48 48 0 1 0 34 34" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 34 A22 22 0 1 1 6 -14" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M2 -18 L14 -10 L4 1 Z" fill="#94A3B8"/>
    <text x="0" y="6" fill="#94A3B8" font-size="17" font-weight="700" text-anchor="middle">chờ thêm</text>
    <text x="0" y="142" fill="#64748B" font-size="15" font-weight="600" text-anchor="middle">vòng xoáy tê liệt phân tích</text>
  </g>
  <!-- footer -->
  <text x="80" y="568" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
