<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt005" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="akt005" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt005)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">RAG là gì?</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Tra cứu trước — rồi mới trả lời</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: question -> retrieve from knowledge base -> sourced answer -->
  <g transform="translate(700,180)">
    <!-- question chip -->
    <rect x="0" y="74" width="120" height="56" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="60" y="100" fill="#E2E8F0" font-size="17" text-anchor="middle">Câu hỏi</text>
    <text x="60" y="120" fill="#94A3B8" font-size="13" text-anchor="middle">"doanh thu?"</text>
    <!-- arrow to retrieval -->
    <path d="M124 102 L172 102" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt005)"/>
    <!-- retrieval: knowledge base / shelf -->
    <rect x="180" y="46" width="148" height="112" rx="14" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <text x="254" y="72" fill="#818CF8" font-size="15" font-weight="700" text-anchor="middle">TRA CỨU</text>
    <g transform="translate(198,86)">
      <rect x="0" y="0" width="112" height="14" rx="3" fill="#312E81"/>
      <rect x="0" y="20" width="112" height="14" rx="3" fill="#3730A3"/>
      <rect x="0" y="40" width="112" height="14" rx="3" fill="#312E81"/>
    </g>
    <text x="254" y="178" fill="#94A3B8" font-size="13" text-anchor="middle">kho tri thức / schema</text>
    <!-- arrow to answer -->
    <path d="M332 102 L380 102" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt005)"/>
    <!-- answer with source -->
    <rect x="388" y="58" width="124" height="88" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="450" y="92" fill="#4ADE80" font-size="18" font-weight="700" text-anchor="middle">Trả lời</text>
    <text x="450" y="120" fill="#94A3B8" font-size="14" text-anchor="middle">+ dẫn nguồn</text>
  </g>
</svg>
