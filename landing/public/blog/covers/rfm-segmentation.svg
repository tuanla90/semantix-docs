<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgrfm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="0.55" stop-color="#0B3B2E"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgrfm)"/>
  <g stroke="#134E4A" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- category label -->
  <rect x="80" y="96" width="270" height="40" rx="20" fill="#134E4A"/>
  <text x="215" y="123" fill="#99F6E4" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">PHÂN TÍCH DỮ LIỆU</text>

  <!-- title -->
  <text x="80" y="262" fill="#ffffff" font-size="120" font-weight="800" letter-spacing="4">RFM</text>
  <text x="80" y="324" fill="#5EEAD4" font-size="30" font-weight="700">Recency · Frequency · Monetary</text>
  <text x="80" y="372" fill="#CBD5E1" font-size="26" font-weight="500">Phân khúc khách để bán đúng người</text>

  <text x="80" y="528" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: 2x3 segment grid -->
  <g transform="translate(760,348) scale(0.695)">
    <rect x="0"   y="0"   width="170" height="92" rx="10" fill="#15803d"/>
    <text x="85"  y="52"  fill="#fff" font-size="18" font-weight="800" text-anchor="middle">Champions</text>
    <rect x="182" y="0"   width="170" height="92" rx="10" fill="#22c55e"/>
    <text x="267" y="52"  fill="#06351f" font-size="18" font-weight="800" text-anchor="middle">Loyal</text>

    <rect x="0"   y="104" width="170" height="92" rx="10" fill="#f59e0b"/>
    <text x="85"  y="156" fill="#3b2606" font-size="18" font-weight="800" text-anchor="middle">At-Risk</text>
    <rect x="182" y="104" width="170" height="92" rx="10" fill="#fbbf24"/>
    <text x="267" y="156" fill="#3b2606" font-size="17" font-weight="800" text-anchor="middle">Hibernating</text>

    <rect x="0"   y="208" width="170" height="92" rx="10" fill="#9ca3af"/>
    <text x="85"  y="260" fill="#1f2937" font-size="18" font-weight="800" text-anchor="middle">Lost</text>
    <rect x="182" y="208" width="170" height="92" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="267" y="260" fill="#64748B" font-size="18" font-weight="700" text-anchor="middle">New</text>
  </g>
</svg>
