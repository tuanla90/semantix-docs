<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt040" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cellpt040" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <marker id="arrpt040" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt040)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Roll Rate Analysis</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Khách đang trượt &amp; về đâu?</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: roll-rate matrix, cells darken along the diagonal, slide arrow below -->
  <g transform="translate(740,150)">
    <!-- row 0 -->
    <rect x="0" y="0" width="74" height="74" rx="8" fill="url(#cellpt040)"/>
    <rect x="82" y="0" width="74" height="74" rx="8" fill="#22C55E" opacity="0.5"/>
    <rect x="164" y="0" width="74" height="74" rx="8" fill="#22C55E" opacity="0.28"/>
    <rect x="246" y="0" width="74" height="74" rx="8" fill="#22C55E" opacity="0.18"/>
    <!-- row 1 -->
    <rect x="0" y="82" width="74" height="74" rx="8" fill="#22C55E" opacity="0.42"/>
    <rect x="82" y="82" width="74" height="74" rx="8" fill="url(#cellpt040)"/>
    <rect x="164" y="82" width="74" height="74" rx="8" fill="#22C55E" opacity="0.5"/>
    <rect x="246" y="82" width="74" height="74" rx="8" fill="#22C55E" opacity="0.28"/>
    <!-- row 2 -->
    <rect x="0" y="164" width="74" height="74" rx="8" fill="#22C55E" opacity="0.22"/>
    <rect x="82" y="164" width="74" height="74" rx="8" fill="#22C55E" opacity="0.5"/>
    <rect x="164" y="164" width="74" height="74" rx="8" fill="url(#cellpt040)"/>
    <rect x="246" y="164" width="74" height="74" rx="8" fill="#22C55E" opacity="0.55"/>
    <!-- row 3 -->
    <rect x="0" y="246" width="74" height="74" rx="8" fill="#22C55E" opacity="0.14"/>
    <rect x="82" y="246" width="74" height="74" rx="8" fill="#22C55E" opacity="0.26"/>
    <rect x="164" y="246" width="74" height="74" rx="8" fill="#22C55E" opacity="0.5"/>
    <rect x="246" y="246" width="74" height="74" rx="8" fill="url(#cellpt040)"/>
    <!-- diagonal slide arrow: top-left to bottom-right -->
    <path d="M30 30 L290 290" stroke="#F59E0B" stroke-width="4" fill="none" stroke-dasharray="2 12" stroke-linecap="round" marker-end="url(#arrpt040)" opacity="0.95"/>
  </g>
