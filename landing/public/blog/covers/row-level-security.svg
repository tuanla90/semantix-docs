<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt004" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="spotkt004" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt004)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Row-Level Security</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="28" font-weight="600">Mỗi người chỉ thấy phần của mình</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: one shared table, each user "soi" only their own rows -->
  <g transform="translate(720,160)">
    <!-- the shared table -->
    <rect x="0" y="0" width="430" height="280" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="20" y="-14" fill="#94A3B8" font-size="16" font-weight="600">bảng doanh thu (chung)</text>
    <!-- header row -->
    <rect x="14" y="14" width="402" height="34" rx="6" fill="#1E293B"/>
    <text x="30" y="37" fill="#64748B" font-size="14">chi_nhanh</text>
    <text x="210" y="37" fill="#64748B" font-size="14">doanh_thu</text>
    <!-- data rows: highlighted = visible to this user, dim = hidden -->
    <!-- row Q1 visible -->
    <rect x="14" y="56" width="402" height="34" rx="6" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="30" y="79" fill="#E2E8F0" font-size="14">Quận 1</text>
    <text x="210" y="79" fill="#E2E8F0" font-size="14">42 triệu</text>
    <circle cx="392" cy="73" r="7" fill="#4ADE80"/>
    <!-- row Q7 hidden -->
    <rect x="14" y="96" width="402" height="34" rx="6" fill="#161E2E"/>
    <text x="30" y="119" fill="#3B4658" font-size="14">Quận 7</text>
    <rect x="206" y="105" width="90" height="16" rx="4" fill="#1E293B"/>
    <text x="392" y="119" fill="#3B4658" font-size="16" text-anchor="middle">✕</text>
    <!-- row Thu Duc hidden -->
    <rect x="14" y="136" width="402" height="34" rx="6" fill="#161E2E"/>
    <text x="30" y="159" fill="#3B4658" font-size="14">Thủ Đức</text>
    <rect x="206" y="145" width="90" height="16" rx="4" fill="#1E293B"/>
    <text x="392" y="159" fill="#3B4658" font-size="16" text-anchor="middle">✕</text>
    <!-- row Q1 again visible -->
    <rect x="14" y="176" width="402" height="34" rx="6" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="30" y="199" fill="#E2E8F0" font-size="14">Quận 1</text>
    <text x="210" y="199" fill="#E2E8F0" font-size="14">38 triệu</text>
    <circle cx="392" cy="193" r="7" fill="#4ADE80"/>
    <!-- row Binh Thanh hidden -->
    <rect x="14" y="216" width="402" height="34" rx="6" fill="#161E2E"/>
    <text x="30" y="239" fill="#3B4658" font-size="14">Bình Thạnh</text>
    <rect x="206" y="225" width="90" height="16" rx="4" fill="#1E293B"/>
    <text x="392" y="239" fill="#3B4658" font-size="16" text-anchor="middle">✕</text>
  </g>
  <!-- the viewer "soi" lens on the left of the table -->
  <g transform="translate(610,250)">
    <circle cx="0" cy="0" r="62" fill="url(#spotkt004)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#818CF8" stroke-width="3"/>
    <line x1="29" y1="29" x2="58" y2="58" stroke="#818CF8" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="6" fill="#C7D2FE" font-size="15" font-weight="700" text-anchor="middle">Quận 1</text>
  </g>
</svg>
