<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- title -->
  <text x="80" y="162" fill="#F1F5F9" font-size="50" font-weight="800">5 sai lầm kinh điển khi</text>
  <text x="80" y="220" fill="#F1F5F9" font-size="50" font-weight="800">phân tích dữ liệu</text>
  <!-- subtitle -->
  <text x="80" y="270" fill="#94A3B8" font-size="25" font-weight="500">Con số không nói dối &#8212; người đọc số mới nói dối</text>
  <!-- illustration: a misread chart with a hidden trap -->
  <g transform="translate(80,320)">
    <rect x="0" y="0" width="1040" height="210" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <text x="28" y="40" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">CÁI BẪY CON SỐ</text>
    <!-- baseline -->
    <line x1="40" y1="170" x2="640" y2="170" stroke="#334155" stroke-width="1.5"/>
    <!-- small orders cluster -->
    <rect x="60"  y="108" width="30" height="62" rx="3" fill="url(#bar)"/>
    <rect x="100" y="92"  width="30" height="78" rx="3" fill="url(#bar)"/>
    <rect x="140" y="100" width="30" height="70" rx="3" fill="url(#bar)"/>
    <rect x="180" y="124" width="30" height="46" rx="3" fill="url(#bar)"/>
    <rect x="220" y="142" width="30" height="28" rx="3" fill="url(#bar)"/>
    <!-- whales far right -->
    <rect x="560" y="60" width="26" height="110" rx="3" fill="#7F1D1D"/>
    <rect x="592" y="60" width="26" height="110" rx="3" fill="#7F1D1D"/>
    <text x="592" y="50" fill="#F87171" font-size="13" font-weight="700" text-anchor="middle">outlier</text>
    <!-- median vs mean lines -->
    <line x1="160" y1="56" x2="160" y2="178" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="160" y="196" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">median</text>
    <line x1="380" y1="56" x2="380" y2="178" stroke="#F87171" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="380" y="196" fill="#F87171" font-size="14" font-weight="700" text-anchor="middle">mean</text>
    <!-- right side: rising total hiding falling groups -->
    <g transform="translate(720,40)">
      <text x="0" y="0" fill="#64748B" font-size="14" font-weight="600">Tổng ↑ nhưng từng nhóm ↓</text>
      <polyline points="0,110 70,92 140,72 210,52 280,34" fill="none" stroke="#22D3EE" stroke-width="3"/>
      <text x="250" y="26" fill="#22D3EE" font-size="13" font-weight="700">tổng</text>
      <polyline points="0,70 70,80 140,92 210,104 280,118" fill="none" stroke="#F87171" stroke-width="2.5" stroke-dasharray="4 4"/>
      <polyline points="0,118 70,124 140,130 210,138 280,146" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="4 4"/>
      <text x="250" y="160" fill="#F87171" font-size="12" font-weight="600">nhóm A</text>
      <text x="120" y="160" fill="#FBBF24" font-size="12" font-weight="600">nhóm B</text>
    </g>
  </g>
  <!-- footer -->
  <text x="80" y="572" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX &#8226; BLOG</text>
</svg>
