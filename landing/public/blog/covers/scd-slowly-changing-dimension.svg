<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt035" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rowkt035" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <marker id="arrkt035" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt035)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">SCD — chiều thay đổi chậm</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="29" font-weight="600">Khách đổi tỉnh — đơn cũ về đâu?</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: one dimension record changing value over time -->
  <g transform="translate(700,150)">
    <!-- original record -->
    <rect x="0" y="0" width="430" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="35" fill="#94A3B8" font-size="20">KH01 • Hà •</text>
    <text x="178" y="35" fill="#64748B" font-size="20" text-decoration="line-through">Hà Nội</text>
    <text x="290" y="35" fill="#64748B" font-size="16">2024–2027</text>
    <!-- Type 1: overwrite (ghi đè) -->
    <text x="0" y="118" fill="#64748B" font-size="17" font-weight="700">TYPE 1 — GHI ĐÈ</text>
    <rect x="0" y="132" width="430" height="56" rx="10" fill="#0B1220" stroke="#475569"/>
    <text x="20" y="167" fill="#94A3B8" font-size="20">KH01 • Hà •</text>
    <text x="178" y="167" fill="#34D399" font-size="20" font-weight="700">TP.HCM</text>
    <text x="320" y="167" fill="#64748B" font-size="16">mất lịch sử</text>
    <!-- Type 2: add row (thêm dòng) -->
    <text x="0" y="246" fill="#818CF8" font-size="17" font-weight="700">TYPE 2 — THÊM DÒNG MỚI</text>
    <rect x="0" y="260" width="430" height="48" rx="10" fill="#0F172A" stroke="#312E81"/>
    <text x="20" y="290" fill="#CBD5E1" font-size="19">KH01 • Hà • Hà Nội</text>
    <text x="300" y="290" fill="#64748B" font-size="15">đến 05/2027</text>
    <rect x="0" y="318" width="430" height="48" rx="10" fill="#0F172A" stroke="url(#rowkt035)" stroke-width="2"/>
    <text x="20" y="348" fill="#E2E8F0" font-size="19" font-weight="700">KH01 • Hà • TP.HCM</text>
    <text x="300" y="348" fill="#34D399" font-size="15">hiện hành</text>
  </g>
  <!-- arrow time axis -->
  <path d="M700 470 L1130 470" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arrkt035)"/>
  <text x="700" y="498" fill="#64748B" font-size="16">thời gian</text>
</svg>
