<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt050" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt050)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Scenario Analysis</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Một con số → một dải kịch bản</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: one starting point radiates into three diverging scenario paths -->
  <g transform="translate(700,330)">
    <!-- starting point -->
    <circle cx="20" cy="0" r="9" fill="#E2E8F0"/>
    <text x="20" y="40" fill="#94A3B8" font-size="16" text-anchor="middle">hôm nay</text>
    <!-- optimistic path (green, up) -->
    <path d="M28 -3 C160 -30 300 -90 420 -150" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="420" cy="-150" r="7" fill="#10B981"/>
    <text x="438" y="-145" fill="#10B981" font-size="20" font-weight="700">Lạc quan</text>
    <!-- base path (indigo, flat) -->
    <path d="M28 0 C160 6 300 10 420 14" stroke="#6366F1" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="420" cy="14" r="7" fill="#6366F1"/>
    <text x="438" y="20" fill="#818CF8" font-size="20" font-weight="700">Cơ sở</text>
    <!-- cautious path (red, down) -->
    <path d="M28 3 C160 40 300 90 420 150" stroke="#EF4444" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="420" cy="150" r="7" fill="#EF4444"/>
    <text x="438" y="156" fill="#EF4444" font-size="20" font-weight="700">Thận trọng</text>
  </g>
</svg>
