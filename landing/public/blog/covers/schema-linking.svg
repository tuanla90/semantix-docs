<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgai007" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="aai007" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
    <marker id="aai007g" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#4ADE80"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgai007)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Schema linking</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="28" font-weight="600">Nối câu hỏi → đúng bảng / cột</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: VN question links to right table/column among many -->
  <g transform="translate(80,360)">
    <rect x="0" y="0" width="250" height="58" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="125" y="35" fill="#E2E8F0" font-size="20" text-anchor="middle">"doanh thu tháng này?"</text>
  </g>
  <g transform="translate(720,120)">
    <!-- database table card -->
    <rect x="0" y="0" width="360" height="360" rx="16" fill="#0B1220" stroke="#312E81"/>
    <text x="24" y="40" fill="#94A3B8" font-size="18" font-weight="700">DATABASE</text>
    <!-- rows -->
    <rect x="24" y="60" width="312" height="46" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="44" y="89" fill="#64748B" font-size="20">total</text>
    <rect x="24" y="118" width="312" height="46" rx="8" fill="#14241C" stroke="#4ADE80" stroke-width="2"/>
    <text x="44" y="147" fill="#4ADE80" font-size="20" font-weight="700">rev_amt</text>
    <rect x="24" y="176" width="312" height="46" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="44" y="205" fill="#64748B" font-size="20">gmv</text>
    <rect x="24" y="234" width="312" height="46" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="44" y="263" fill="#64748B" font-size="20">amt_2</text>
    <rect x="24" y="292" width="312" height="46" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="44" y="321" fill="#64748B" font-size="20">created_at</text>
  </g>
  <!-- linking arrows: one green correct, others faint -->
  <path d="M330 389 C480 389 520 250 718 263" stroke="#4ADE80" stroke-width="3.5" fill="none" marker-end="url(#aai007g)"/>
  <path d="M330 380 C470 380 540 200 718 205" stroke="#818CF8" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M330 398 C470 398 540 320 718 320" stroke="#818CF8" stroke-width="1.5" fill="none" opacity="0.3"/>
  <text x="500" y="330" fill="#4ADE80" font-size="17" font-weight="700">nối đúng cột</text>
</svg>
