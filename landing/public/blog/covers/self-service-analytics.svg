<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt007" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="akt007" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt007)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Self-service analytics</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Bạn hỏi → có số ngay</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: a business person types a Vietnamese question and gets a chart back, no data-team middleman -->
  <g transform="translate(720,178)">
    <!-- business person avatar -->
    <circle cx="40" cy="60" r="26" fill="#1E293B" stroke="#334155"/>
    <circle cx="40" cy="50" r="11" fill="#94A3B8"/>
    <path d="M22 78 C22 60 58 60 58 78 Z" fill="#94A3B8"/>
    <text x="40" y="118" fill="#64748B" font-size="15" text-anchor="middle">Người KD</text>
    <!-- question bubble (typed in Vietnamese) -->
    <rect x="90" y="22" width="200" height="56" rx="14" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <text x="106" y="46" fill="#E2E8F0" font-size="16">"Kênh nào lời</text>
    <text x="106" y="68" fill="#E2E8F0" font-size="16">nhất tháng này?"</text>
    <!-- arrow straight to answer, no middleman -->
    <path d="M296 50 L356 50" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#akt007)"/>
    <text x="326" y="38" fill="#4ADE80" font-size="13" text-anchor="middle" font-weight="700">ngay</text>
    <!-- chart card returned -->
    <rect x="362" y="6" width="172" height="160" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="448" y="32" fill="#4ADE80" font-size="16" font-weight="700" text-anchor="middle">Biểu đồ</text>
    <g transform="translate(380,52)">
      <rect x="0" y="62" width="20" height="30" rx="2" fill="#475569"/>
      <rect x="30" y="42" width="20" height="50" rx="2" fill="#64748B"/>
      <rect x="60" y="14" width="20" height="78" rx="2" fill="#818CF8"/>
      <rect x="90" y="36" width="20" height="56" rx="2" fill="#7DD3FC"/>
      <rect x="120" y="50" width="20" height="42" rx="2" fill="#4ADE80"/>
    </g>
  </g>
</svg>
