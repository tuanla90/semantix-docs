<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgsl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrBad" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#EF4444"/>
    </marker>
    <marker id="arrGood" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#34D399"/>
    </marker>
    <marker id="arrInd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgsl)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Title block -->
  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="204" fill="#ffffff" font-size="50" font-weight="800">Cắm thẳng DB vs Semantic Layer</text>
  <text x="80" y="262" fill="#CBD5E1" font-size="27" font-weight="600">Đoán schema — hay tra một cuốn từ điển có luật?</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- Row 1: DB -> AI directly (messy, wrong) -->
  <g transform="translate(80,330)">
    <text x="0" y="-14" fill="#FCA5A5" font-size="16" font-weight="700" letter-spacing="1">CẮM THẲNG</text>
    <!-- DB cylinder -->
    <g transform="translate(0,0)">
      <ellipse cx="46" cy="12" rx="46" ry="14" fill="#13203A" stroke="#475569" stroke-width="2"/>
      <path d="M0 12 L0 56 A46 14 0 0 0 92 56 L92 12" fill="#13203A" stroke="#475569" stroke-width="2"/>
      <ellipse cx="46" cy="12" rx="46" ry="14" fill="none" stroke="#64748B" stroke-width="1.5"/>
      <text x="46" y="44" fill="#94A3B8" font-size="16" font-weight="700" text-anchor="middle">DB</text>
    </g>
    <!-- tangled arrows -->
    <path d="M100 30 C160 6, 210 70, 286 26" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrBad)"/>
    <path d="M100 42 C170 80, 220 4, 286 44" fill="none" stroke="#EF4444" stroke-width="2.5" opacity="0.8"/>
    <text x="190" y="-2" fill="#FCA5A5" font-size="22" font-weight="800">?</text>
    <text x="150" y="84" fill="#FCA5A5" font-size="22" font-weight="800">?</text>
    <!-- AI box -->
    <g transform="translate(300,4)">
      <rect x="0" y="0" width="92" height="56" rx="12" fill="#0B1220" stroke="#EF4444" stroke-width="2"/>
      <text x="46" y="35" fill="#FCA5A5" font-size="20" font-weight="800" text-anchor="middle">AI</text>
    </g>
    <text x="410" y="40" fill="#EF4444" font-size="18" font-weight="700">✗ số sai, tự tin</text>
  </g>

  <!-- Row 2: DB -> Semantic Layer -> AI (clean, correct) -->
  <g transform="translate(80,430)">
    <text x="0" y="76" fill="#34D399" font-size="16" font-weight="700" letter-spacing="1">QUA SEMANTIC LAYER</text>
    <!-- DB cylinder -->
    <g transform="translate(0,0)">
      <ellipse cx="46" cy="12" rx="46" ry="14" fill="#13203A" stroke="#475569" stroke-width="2"/>
      <path d="M0 12 L0 56 A46 14 0 0 0 92 56 L92 12" fill="#13203A" stroke="#475569" stroke-width="2"/>
      <ellipse cx="46" cy="12" rx="46" ry="14" fill="none" stroke="#64748B" stroke-width="1.5"/>
      <text x="46" y="44" fill="#94A3B8" font-size="16" font-weight="700" text-anchor="middle">DB</text>
    </g>
    <path d="M100 34 L150 34" stroke="#818CF8" stroke-width="3" marker-end="url(#arrInd)"/>
    <!-- Semantic layer box -->
    <g transform="translate(158,4)">
      <rect x="0" y="0" width="200" height="56" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="2.5"/>
      <line x1="16" y1="22" x2="184" y2="22" stroke="#4F46E5" stroke-width="2" opacity="0.7"/>
      <line x1="16" y1="34" x2="184" y2="34" stroke="#4F46E5" stroke-width="2" opacity="0.7"/>
      <text x="100" y="48" fill="#C7D2FE" font-size="15" font-weight="700" text-anchor="middle">SEMANTIC LAYER</text>
    </g>
    <path d="M366 34 L416 34" stroke="#34D399" stroke-width="3" marker-end="url(#arrGood)"/>
    <!-- AI box -->
    <g transform="translate(424,4)">
      <rect x="0" y="0" width="92" height="56" rx="12" fill="#0B1220" stroke="#34D399" stroke-width="2"/>
      <text x="46" y="35" fill="#34D399" font-size="20" font-weight="800" text-anchor="middle">AI</text>
    </g>
    <text x="534" y="40" fill="#34D399" font-size="18" font-weight="700">✓ cùng câu, cùng số</text>
  </g>

  <!-- Code/dict motif on the right -->
  <g transform="translate(880,320)">
    <rect x="0" y="0" width="240" height="150" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="18" y="38" fill="#7DD3FC" font-size="16" font-family="monospace">doanh_thu =</text>
    <text x="34" y="64" fill="#E2E8F0" font-size="15" font-family="monospace">SUM(gross</text>
    <text x="34" y="86" fill="#E2E8F0" font-size="15" font-family="monospace">  - discount)</text>
    <text x="34" y="108" fill="#C7D2FE" font-size="15" font-family="monospace">WHERE status</text>
    <text x="34" y="130" fill="#C7D2FE" font-size="15" font-family="monospace">  = 'completed'</text>
  </g>
  <text x="880" y="500" fill="#64748B" font-size="15" font-weight="600">định nghĩa một lần, dùng mãi</text>
</svg>
