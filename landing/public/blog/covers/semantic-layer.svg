<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="150" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="245" fill="#ffffff" font-size="56" font-weight="800">Semantic Layer</text>
  <text x="80" y="318" fill="#CBD5E1" font-size="34" font-weight="600">Một định nghĩa. Cho cả công ty.</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: ba định nghĩa rời -> một con số chuẩn -->
  <g transform="translate(770,180)">
    <rect x="0" y="0" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="33" fill="#94A3B8" font-size="20" font-family="monospace">gross_amount</text>
    <rect x="0" y="80" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="113" fill="#94A3B8" font-size="20" font-family="monospace">- discount</text>
    <rect x="0" y="160" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="193" fill="#94A3B8" font-size="20" font-family="monospace">status=done</text>
    <path d="M230 106 L300 106" stroke="#818CF8" stroke-width="3" marker-end="url(#a)"/>
    <rect x="300" y="74" width="170" height="64" rx="14" fill="url(#accent)"/>
    <text x="385" y="114" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">doanh_thu</text>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
