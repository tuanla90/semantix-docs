<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="118" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">SO SÁNH &amp; LỰA CHỌN</text>
  <text x="80" y="200" fill="#ffffff" font-size="56" font-weight="800">Semantix vs Power BI</text>
  <text x="80" y="258" fill="#CBD5E1" font-size="29" font-weight="600">DAX · license theo user · Q&amp;A không hiểu tiếng Việt</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: hai cột "vs" -->
  <!-- Cột trái: Power BI — DAX + license theo user -->
  <g transform="translate(150,318)">
    <rect x="0" y="0" width="330" height="174" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="32" fill="#94A3B8" font-size="17" font-weight="700" letter-spacing="1">POWER BI</text>
    <!-- measure DAX -->
    <rect x="20" y="46" width="290" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="34" y="68" fill="#94A3B8" font-size="13" font-family="monospace">Tăng trưởng =</text>
    <text x="34" y="86" fill="#FCD34D" font-size="13" font-family="monospace">CALCULATE(SUM(...),</text>
    <text x="34" y="102" fill="#FCD34D" font-size="13" font-family="monospace">  DATEADD(Lich,-1,MONTH))</text>
    <!-- license theo user -->
    <g transform="translate(20,122)">
      <circle cx="9" cy="9" r="8" fill="#475569"/>
      <circle cx="33" cy="9" r="8" fill="#475569"/>
      <circle cx="57" cy="9" r="8" fill="#475569"/>
      <text x="78" y="14" fill="#FCA5A5" font-size="15" font-weight="700">Pro / user / tháng</text>
    </g>
    <text x="20" y="162" fill="#64748B" font-size="14">Mạnh — nếu có người viết DAX</text>
  </g>

  <!-- VS -->
  <g transform="translate(600,405)">
    <circle cx="0" cy="0" r="42" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
    <text x="0" y="12" fill="#818CF8" font-size="34" font-weight="800" text-anchor="middle">vs</text>
  </g>

  <!-- Cột phải: Semantix — câu hỏi tiếng Việt -> trả lời -->
  <g transform="translate(720,318)">
    <rect x="0" y="0" width="330" height="174" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="32" fill="#94A3B8" font-size="17" font-weight="700" letter-spacing="1">SEMANTIX — HỎI TIẾNG VIỆT</text>
    <rect x="20" y="48" width="240" height="40" rx="20" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="73" fill="#CBD5E1" font-size="15">Doanh thu quý vừa rồi?</text>
    <path d="M150 94 L150 114" stroke="#818CF8" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="20" y="118" width="170" height="42" rx="12" fill="url(#accent)"/>
    <text x="105" y="145" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">4,2 tỷ</text>
    <text x="210" y="146" fill="#64748B" font-size="14">vài giây</text>
  </g>
</svg>
