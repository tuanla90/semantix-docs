<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt036" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lenskt036" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt036)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Snapshot table</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Chụp trạng thái kho theo từng ngày</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: a camera snapshotting warehouse state per day -->
  <g transform="translate(740,190)">
    <!-- camera body -->
    <rect x="0" y="60" width="240" height="150" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="34" width="90" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="180" y="78" width="34" height="16" rx="4" fill="#475569"/>
    <!-- lens -->
    <circle cx="115" cy="135" r="58" fill="#0B1220" stroke="#4C4099" stroke-width="3"/>
    <circle cx="115" cy="135" r="40" fill="url(#lenskt036)" opacity="0.9"/>
    <circle cx="115" cy="135" r="22" fill="#0B1220"/>
    <circle cx="103" cy="123" r="7" fill="#A5B4FC" opacity="0.8"/>
    <!-- flash -->
    <circle cx="200" cy="100" r="6" fill="#FBBF24"/>
  </g>
  <!-- snapshot frames stacked: per-day state cards -->
  <g transform="translate(720,420)">
    <rect x="0" y="0" width="150" height="92" rx="10" fill="#1E1B4B" stroke="#4C4099" stroke-width="2"/>
    <text x="75" y="30" fill="#A5B4FC" font-size="18" text-anchor="middle" font-weight="600">01/06</text>
    <text x="75" y="68" fill="#ffffff" font-size="30" text-anchor="middle" font-weight="800">200</text>
    <rect x="168" y="0" width="150" height="92" rx="10" fill="#1E1B4B" stroke="#4C4099" stroke-width="2"/>
    <text x="243" y="30" fill="#A5B4FC" font-size="18" text-anchor="middle" font-weight="600">02/06</text>
    <text x="243" y="68" fill="#ffffff" font-size="30" text-anchor="middle" font-weight="800">174</text>
    <rect x="336" y="0" width="150" height="92" rx="10" fill="#1E1B4B" stroke="#4C4099" stroke-width="2"/>
    <text x="411" y="30" fill="#A5B4FC" font-size="18" text-anchor="middle" font-weight="600">03/06</text>
    <text x="411" y="68" fill="#ffffff" font-size="30" text-anchor="middle" font-weight="800">174</text>
  </g>
  <text x="720" y="548" fill="#64748B" font-size="16">tồn cuối mỗi ngày — đọc thẳng, khỏi cộng dồn</text>
</svg>
