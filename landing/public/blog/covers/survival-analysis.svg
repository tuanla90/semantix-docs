<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgPt042" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fillPt042" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgPt042)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Survival Analysis</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Khách &amp; sống được bao lâu?</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: survival curves on a small axis -->
  <g transform="translate(700,150)">
    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="300" x2="420" y2="300" stroke="#475569" stroke-width="2"/>
    <text x="-12" y="10" fill="#64748B" font-size="15" text-anchor="end">100%</text>
    <text x="-12" y="305" fill="#64748B" font-size="15" text-anchor="end">0</text>
    <text x="420" y="328" fill="#64748B" font-size="15" text-anchor="end">tuổi đời →</text>
    <!-- high-value curve: flattens out, with fill -->
    <path d="M0 0 L0 300 L420 300 L420 99 C360 100 300 102 240 110 C180 120 110 150 0 0 Z" fill="url(#fillPt042)"/>
    <path d="M0 0 C110 150 180 120 240 110 C300 102 360 100 420 99" fill="none" stroke="#10B981" stroke-width="4"/>
    <!-- mid curve -->
    <path d="M0 0 C90 170 150 215 230 240 C300 262 360 270 420 273" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
    <!-- one-time curve: near vertical drop -->
    <path d="M0 0 C40 215 70 270 130 285 C220 298 320 297 420 297" fill="none" stroke="#EF4444" stroke-width="3.5"/>
    <!-- endpoint dots -->
    <circle cx="420" cy="99" r="6" fill="#10B981"/>
    <circle cx="420" cy="273" r="5" fill="#F59E0B"/>
    <circle cx="420" cy="297" r="5" fill="#EF4444"/>
  </g>
</svg>
