<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bghd013" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="ahd013" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bghd013)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Metric tính toán</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Định nghĩa một lần — dùng mãi</text>
  <text x="80" y="360" fill="#94A3B8" font-size="22" font-weight="500">Lợi nhuận gộp &amp; AOV, không cần công thức Excel</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: source columns → formula → shared metric -->
  <g transform="translate(720,180)">
    <!-- source columns -->
    <rect x="0" y="0" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="75" y="29" fill="#E2E8F0" font-size="18" text-anchor="middle">Doanh thu</text>
    <rect x="0" y="92" width="150" height="46" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="75" y="121" fill="#E2E8F0" font-size="18" text-anchor="middle">Giá vốn</text>
    <!-- arrows into formula -->
    <path d="M156 23 C214 23 214 92 268 100" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ahd013)"/>
    <path d="M156 115 C214 115 214 108 268 100" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ahd013)"/>
    <!-- formula node -->
    <rect x="286" y="74" width="62" height="52" rx="12" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <text x="317" y="108" fill="#818CF8" font-size="26" font-weight="800" text-anchor="middle">−</text>
    <!-- arrow to new metric -->
    <path d="M350 100 L404 100" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ahd013)"/>
    <!-- new shared metric -->
    <rect x="420" y="58" width="190" height="84" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="515" y="92" fill="#4ADE80" font-size="20" font-weight="700" text-anchor="middle">Lợi nhuận gộp</text>
    <text x="515" y="120" fill="#94A3B8" font-size="16" text-anchor="middle">→ dùng chung</text>
    <!-- mini bars under the shared metric -->
    <g transform="translate(432,168)">
      <rect x="0" y="22" width="14" height="18" rx="2" fill="#475569"/>
      <rect x="22" y="12" width="14" height="28" rx="2" fill="#64748B"/>
      <rect x="44" y="0" width="14" height="40" rx="2" fill="#818CF8"/>
      <rect x="66" y="16" width="14" height="24" rx="2" fill="#64748B"/>
      <rect x="88" y="8" width="14" height="32" rx="2" fill="#7DD3FC"/>
      <rect x="110" y="20" width="14" height="20" rx="2" fill="#475569"/>
      <rect x="132" y="6" width="14" height="34" rx="2" fill="#4ADE80"/>
    </g>
  </g>
</svg>
