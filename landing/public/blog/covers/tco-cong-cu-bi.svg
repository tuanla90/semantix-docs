<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0F2238"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">SO SÁNH &amp; LỰA CHỌN</text>
  <!-- title -->
  <text x="80" y="162" fill="#F1F5F9" font-size="50" font-weight="800">&#8220;Miễn phí&#8221; thường đắt nhất</text>
  <text x="80" y="214" fill="#94A3B8" font-size="26" font-weight="500">Tổng chi phí sở hữu (TCO) của một công cụ BI —</text>
  <text x="80" y="248" fill="#94A3B8" font-size="26" font-weight="500">license 0đ chỉ là phần nổi của tảng băng</text>
  <!-- iceberg illustration -->
  <g transform="translate(760,300)">
    <!-- waterline -->
    <line x1="-220" y1="0" x2="240" y2="0" stroke="#22D3EE" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="-216" y="-12" fill="#22D3EE" font-size="14" font-weight="700">mặt nước = báo giá</text>
    <!-- tip above water -->
    <polygon points="10,-90 -45,0 65,0" fill="url(#tip)"/>
    <text x="10" y="-30" fill="#0B1120" font-size="16" font-weight="800" text-anchor="middle">$0</text>
    <text x="10" y="-12" fill="#0B1120" font-size="12" font-weight="700" text-anchor="middle">license</text>
    <!-- submerged body -->
    <polygon points="-45,2 65,2 175,250 -155,250 " fill="url(#ice)" stroke="#1E3A5F" stroke-width="1"/>
    <text x="10" y="58" fill="#CBD5E1" font-size="15" font-weight="700" text-anchor="middle">Triển khai</text>
    <text x="10" y="110" fill="#CBD5E1" font-size="15" font-weight="700" text-anchor="middle">Vận hành</text>
    <text x="10" y="162" fill="#E2E8F0" font-size="16" font-weight="800" text-anchor="middle">Người</text>
    <text x="10" y="214" fill="#FCA5A5" font-size="15" font-weight="700" text-anchor="middle">Thời gian</text>
  </g>
  <!-- footer -->
  <text x="80" y="540" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
