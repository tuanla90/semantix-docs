<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg4)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Text-to-SQL</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Câu hỏi tiếng Việt → truy vấn dữ liệu</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: NL -> SQL -->
  <g transform="translate(700,200)">
    <rect x="0" y="0" width="300" height="56" rx="28" fill="#1E293B" stroke="#334155"/>
    <text x="150" y="36" fill="#E2E8F0" font-size="22" text-anchor="middle">"doanh thu tháng này"</text>
    <path d="M150 70 L150 110" stroke="#818CF8" stroke-width="3" marker-end="url(#a4)"/>
    <rect x="-20" y="120" width="420" height="170" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="6" y="156" fill="#7DD3FC" font-size="20" font-family="monospace">SELECT</text>
    <text x="92" y="156" fill="#E2E8F0" font-size="20" font-family="monospace">SUM(amount)</text>
    <text x="6" y="186" fill="#7DD3FC" font-size="20" font-family="monospace">FROM</text>
    <text x="72" y="186" fill="#E2E8F0" font-size="20" font-family="monospace">orders</text>
    <text x="6" y="216" fill="#7DD3FC" font-size="20" font-family="monospace">WHERE</text>
    <text x="88" y="216" fill="#FCA5A5" font-size="20" font-family="monospace">status='done'</text>
    <text x="6" y="246" fill="#E2E8F0" font-size="20" font-family="monospace">  AND month = now</text>
    <text x="6" y="276" fill="#4ADE80" font-size="18" font-family="monospace">-- ✓ đúng định nghĩa</text>
  </g>
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
</svg>
