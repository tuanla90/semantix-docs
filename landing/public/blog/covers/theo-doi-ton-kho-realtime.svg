<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bghd011" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="areahd011" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bghd011)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Theo dõi tồn kho realtime</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Thấy sớm &amp; tự cảnh báo sắp hết hàng</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: declining inventory line touches red threshold, bell rings -->
  <g transform="translate(700,210)">
    <!-- chart frame -->
    <rect x="0" y="0" width="400" height="240" rx="14" fill="#0B1220" stroke="#334155"/>
    <!-- threshold line (red) -->
    <line x1="20" y1="170" x2="380" y2="170" stroke="#EF4444" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="30" y="160" fill="#EF4444" font-size="15" font-weight="700">Ngưỡng đặt thêm</text>
    <!-- area under inventory line -->
    <path d="M20 40 L100 70 L180 110 L260 150 L320 170 L320 210 L20 210 Z" fill="url(#areahd011)"/>
    <!-- inventory line declining to threshold -->
    <polyline points="20,40 100,70 180,110 260,150 320,170" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- point hitting threshold -->
    <circle cx="320" cy="170" r="8" fill="#0B1220" stroke="#EF4444" stroke-width="4"/>
    <!-- alert bell glowing -->
    <g transform="translate(330,30)">
      <circle cx="20" cy="22" r="34" fill="#EF4444" opacity="0.16"/>
      <path d="M20 0 C8 0 2 8 2 20 C2 30 -2 34 -4 38 L44 38 C42 34 38 30 38 20 C38 8 32 0 20 0 Z" fill="#FBBF24" stroke="#F59E0B" stroke-width="1.5"/>
      <path d="M14 42 C14 48 26 48 26 42 Z" fill="#F59E0B"/>
      <circle cx="20" cy="-2" r="4" fill="#FBBF24"/>
    </g>
  </g>
</svg>
