<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="86" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- series badge -->
  <g transform="translate(80,104)">
    <rect x="0" y="0" width="206" height="34" rx="17" fill="#0F172A" stroke="#164E45" stroke-width="1.5"/>
    <text x="103" y="23" fill="#34D399" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">SERIES &#183; PHẦN 2</text>
  </g>
  <!-- title -->
  <text x="80" y="206" fill="#F1F5F9" font-size="50" font-weight="800">Thiết kế một A/B test đúng</text>
  <text x="80" y="262" fill="#94A3B8" font-size="26" font-weight="500">Một giả thuyết, một biến, chia ngẫu nhiên —</text>
  <text x="80" y="296" fill="#94A3B8" font-size="26" font-weight="500">và một tiêu chí thắng định trước khi chạy</text>
  <!-- illustration: traffic splits A/B -> 2 versions -> measure -->
  <g transform="translate(80,360)">
    <!-- traffic source -->
    <circle cx="40" cy="100" r="34" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="40" y="106" fill="#E2E8F0" font-size="26" text-anchor="middle">&#128101;</text>
    <text x="40" y="168" fill="#64748B" font-size="14" text-anchor="middle" font-weight="600">người dùng</text>
    <!-- random split node -->
    <g transform="translate(170,100)">
      <circle r="26" fill="#0B1120" stroke="#22D3EE" stroke-width="2"/>
      <text x="0" y="6" fill="#22D3EE" font-size="22" font-weight="800" text-anchor="middle">&#10005;</text>
      <text x="0" y="56" fill="#64748B" font-size="13" text-anchor="middle" font-weight="600">chia ngẫu nhiên</text>
    </g>
    <!-- connectors source -> split -->
    <line x1="74" y1="100" x2="142" y2="100" stroke="#475569" stroke-width="2.5"/>
    <!-- split -> A (up) and B (down) -->
    <path d="M196 90 C 250 60, 290 50, 340 50" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
    <path d="M196 110 C 250 140, 290 150, 340 150" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
    <!-- version A card -->
    <g transform="translate(350,18)">
      <rect x="0" y="0" width="200" height="64" rx="12" fill="#0F172A" stroke="#155E75" stroke-width="2"/>
      <text x="20" y="28" fill="#67E8F9" font-size="15" font-weight="700">PHIÊN BẢN A</text>
      <rect x="20" y="40" width="120" height="12" rx="6" fill="#1E293B"/>
      <rect x="148" y="38" width="34" height="16" rx="5" fill="url(#barA)"/>
    </g>
    <!-- version B card -->
    <g transform="translate(350,118)">
      <rect x="0" y="0" width="200" height="64" rx="12" fill="#0F172A" stroke="#5B21B6" stroke-width="2"/>
      <text x="20" y="28" fill="#C4B5FD" font-size="15" font-weight="700">PHIÊN BẢN B</text>
      <rect x="20" y="40" width="120" height="12" rx="6" fill="#1E293B"/>
      <rect x="148" y="38" width="34" height="16" rx="5" fill="url(#barB)"/>
    </g>
    <!-- A,B -> measure -->
    <path d="M550 50 C 600 60, 620 80, 660 95" fill="none" stroke="#475569" stroke-width="2.5"/>
    <path d="M550 150 C 600 140, 620 120, 660 105" fill="none" stroke="#475569" stroke-width="2.5"/>
    <!-- measure block -->
    <g transform="translate(670,52)">
      <rect x="0" y="0" width="190" height="96" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <text x="20" y="30" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="1">ĐO METRIC CHÍNH</text>
      <line x1="20" y1="76" x2="168" y2="76" stroke="#334155" stroke-width="1.5"/>
      <rect x="28" y="52" width="20" height="24" rx="3" fill="url(#barA)"/>
      <rect x="60" y="44" width="20" height="32" rx="3" fill="url(#barB)"/>
      <rect x="92" y="58" width="20" height="18" rx="3" fill="url(#barA)"/>
      <rect x="124" y="40" width="20" height="36" rx="3" fill="url(#barB)"/>
      <text x="150" y="34" fill="#34D399" font-size="14" font-weight="700" text-anchor="end">B &#8593;</text>
    </g>
  </g>
  <!-- footer -->
  <text x="80" y="568" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX &#8226; BLOG</text>
</svg>
