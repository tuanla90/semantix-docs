<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- category label -->
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <!-- title -->
  <text x="80" y="162" fill="#F1F5F9" font-size="50" font-weight="800">Ô trống cũng biết nói</text>
  <text x="80" y="214" fill="#94A3B8" font-size="26" font-weight="500">Khi &#8220;thiếu dữ liệu&#8221; chính là một tín hiệu —</text>
  <text x="80" y="248" fill="#94A3B8" font-size="26" font-weight="500">điền đại ô trống là xoá mất thông tin quý</text>
  <!-- illustration: a data table with highlighted empty cells + flag column -->
  <g transform="translate(80,300)">
    <rect x="0" y="0" width="700" height="232" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <text x="24" y="36" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">HỒ SƠ KHÁCH</text>
    <text x="430" y="36" fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="1">đã_trống</text>
    <!-- column headers -->
    <text x="36" y="68" fill="#475569" font-size="13" font-weight="700">Khách</text>
    <text x="150" y="68" fill="#475569" font-size="13" font-weight="700">Nguồn</text>
    <!-- row 1 -->
    <rect x="24" y="80" width="100" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="38" y="102" fill="#CBD5E1" font-size="13">KH001</text>
    <rect x="134" y="80" width="160" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="150" y="102" fill="#CBD5E1" font-size="13">Facebook</text>
    <rect x="430" y="80" width="70" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="465" y="102" fill="#475569" font-size="14" font-weight="700" text-anchor="middle">0</text>
    <!-- row 2 highlighted empty -->
    <circle cx="214" cy="148" r="70" fill="url(#glow)"/>
    <rect x="24" y="131" width="100" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="38" y="153" fill="#CBD5E1" font-size="13">KH002</text>
    <rect x="134" y="131" width="160" height="34" rx="5" fill="#10243a" stroke="#22D3EE" stroke-width="2"/><text x="214" y="153" fill="#7DD3FC" font-size="14" font-weight="800" text-anchor="middle">— trống —</text>
    <rect x="430" y="131" width="70" height="34" rx="5" fill="#16241F" stroke="#34D399" stroke-width="2"/><text x="465" y="153" fill="#34D399" font-size="14" font-weight="800" text-anchor="middle">1</text>
    <!-- row 3 -->
    <rect x="24" y="182" width="100" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="38" y="204" fill="#CBD5E1" font-size="13">KH003</text>
    <rect x="134" y="182" width="160" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="150" y="204" fill="#CBD5E1" font-size="13">Google</text>
    <rect x="430" y="182" width="70" height="34" rx="5" fill="#101a2c" stroke="#1E293B"/><text x="465" y="204" fill="#475569" font-size="14" font-weight="700" text-anchor="middle">0</text>
    <!-- signal annotation -->
    <text x="540" y="150" fill="#34D399" font-size="14" font-weight="700">tín hiệu</text>
    <text x="540" y="172" fill="#64748B" font-size="13">được giữ lại</text>
    <path d="M512 148 L536 148" stroke="#34D399" stroke-width="2.5"/>
    <path d="M530 142 L538 148 L530 154 Z" fill="#34D399"/>
  </g>
  <!-- right vertical flag accent -->
  <rect x="820" y="300" width="6" height="232" rx="3" fill="url(#flag)" opacity="0.7"/>
  <!-- footer -->
  <text x="80" y="572" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
