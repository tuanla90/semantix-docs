<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc19" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="line19" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <marker id="arrow19" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg19)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <text x="80" y="120" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">CÂU CHUYỆN &amp; USE CASE</text>
  <text x="80" y="208" fill="#ffffff" font-size="46" font-weight="800">Nhà bán TikTok Shop mùa sale</text>
  <text x="80" y="262" fill="#CBD5E1" font-size="26" font-weight="600">Quyết định giá theo ngày là đã muộn — đọc số theo giờ</text>
  <text x="80" y="540" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>

  <!-- motif: đường line doanh số tăng vọt theo giờ + đồng hồ khung giờ vàng -->
  <g transform="translate(700,414)">
    <!-- TikTok Shop tag -->
    <g transform="translate(8,-150)">
      <rect x="0" y="0" width="150" height="40" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="75" y="26" fill="#67E8F9" font-size="16" font-weight="700" text-anchor="middle">TikTok Shop</text>
    </g>

    <!-- hourly chart panel: line rising sharply -->
    <g transform="translate(0,-100)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#1E293B" stroke="#312E81" stroke-width="1.5"/>
      <!-- baseline -->
      <line x1="28" y1="180" x2="296" y2="180" stroke="#475569" stroke-width="2"/>
      <!-- hour ticks -->
      <g fill="#64748B" font-size="13" font-weight="700" text-anchor="middle">
        <text x="60" y="202">19h</text>
        <text x="118" y="202">20h</text>
        <text x="176" y="202">21h</text>
        <text x="234" y="202">22h</text>
        <text x="288" y="202">23h</text>
      </g>
      <!-- rising line per hour, spiking late -->
      <polyline points="60,160 118,138 176,150 234,96 288,40" fill="none" stroke="url(#line19)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow19)"/>
      <g fill="#A5B4FC">
        <circle cx="60" cy="160" r="5"/>
        <circle cx="118" cy="138" r="5"/>
        <circle cx="176" cy="150" r="5"/>
        <circle cx="234" cy="96" r="5"/>
        <circle cx="288" cy="40" r="6" fill="#818CF8"/>
      </g>
      <text x="158" y="32" fill="#E0E7FF" font-size="15" font-weight="800" text-anchor="middle">DOANH SỐ THEO GIỜ</text>
    </g>

    <!-- clock: khung giờ vàng -->
    <g transform="translate(360,40)">
      <circle cx="0" cy="0" r="56" fill="url(#acc19)"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#E0E7FF" stroke-width="2" opacity="0.6"/>
      <!-- hour marks -->
      <g stroke="#E0E7FF" stroke-width="2.5" opacity="0.8">
        <line x1="0" y1="-46" x2="0" y2="-38"/>
        <line x1="46" y1="0" x2="38" y2="0"/>
        <line x1="0" y1="46" x2="0" y2="38"/>
        <line x1="-46" y1="0" x2="-38" y2="0"/>
      </g>
      <!-- hands pointing to late hour -->
      <line x1="0" y1="0" x2="22" y2="-22" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      <text x="0" y="86" fill="#A5B4FC" font-size="15" font-weight="800" text-anchor="middle">KHUNG GIỜ VÀNG</text>
    </g>
  </g>
</svg>
