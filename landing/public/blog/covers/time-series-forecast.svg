<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgPt043" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bandPt043" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.30"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgPt043)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Chuỗi thời gian &amp; dự báo</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Tách tín hiệu khỏi mùa vụ &amp; nhiễu</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: actual line → forecast dashed + widening confidence band -->
  <g transform="translate(660,330)">
    <!-- vertical "hôm nay" divider -->
    <line x1="220" y1="-130" x2="220" y2="130" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="150" y="-110" fill="#94A3B8" font-size="18" font-weight="600">hôm nay</text>
    <!-- confidence band: widening cone -->
    <path d="M220,18 L330,-2 L420,-26 L500,-52 L500,40 L420,30 L330,28 L220,18 Z" fill="url(#bandPt043)"/>
    <!-- actual line (past, solid) -->
    <polyline points="0,90 60,72 110,96 160,54 220,18" fill="none" stroke="#818CF8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="0" cy="90" r="6" fill="#818CF8"/>
    <circle cx="60" cy="72" r="6" fill="#818CF8"/>
    <circle cx="110" cy="96" r="6" fill="#818CF8"/>
    <circle cx="160" cy="54" r="6" fill="#818CF8"/>
    <circle cx="220" cy="18" r="7" fill="#E0E7FF"/>
    <!-- forecast line (future, dashed) -->
    <polyline points="220,18 330,-14 420,-40 500,-58" fill="none" stroke="#818CF8" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="330" cy="-14" r="6" fill="#A5B4FC"/>
    <circle cx="420" cy="-40" r="6" fill="#A5B4FC"/>
    <circle cx="500" cy="-58" r="6" fill="#4ADE80"/>
    <!-- labels -->
    <text x="20" y="124" fill="#94A3B8" font-size="17" font-weight="600">thực tế</text>
    <text x="392" y="-72" fill="#4ADE80" font-size="17" font-weight="700">dự báo</text>
    <text x="300" y="74" fill="#A5B4FC" font-size="15">dải tin cậy loe dần</text>
  </g>
</svg>
