<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="150" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">AI &amp; CÔNG NGHỆ</text>
  <text x="80" y="245" fill="#ffffff" font-size="56" font-weight="800">Tối ưu token</text>
  <text x="80" y="318" fill="#CBD5E1" font-size="34" font-weight="600">Cắt 40–60% chi phí AI.</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: cột chi phí token cao bị lớp lọc cắt xuống thấp -->
  <g transform="translate(740,150)">
    <!-- baseline -->
    <line x1="0" y1="300" x2="380" y2="300" stroke="#334155" stroke-width="2"/>
    <!-- cột token thô (cao) -->
    <rect x="20" y="40" width="90" height="260" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="65" y="28" fill="#64748B" font-size="18" font-weight="700" text-anchor="middle">thô</text>
    <!-- lớp lọc ngữ cảnh -->
    <rect x="0" y="150" width="380" height="40" rx="10" fill="url(#accent)" opacity="0.92"/>
    <text x="190" y="176" fill="#fff" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="1">LỌC NGỮ CẢNH</text>
    <!-- cột token sau lọc (thấp) -->
    <rect x="270" y="210" width="90" height="90" rx="8" fill="url(#hot)"/>
    <text x="315" y="200" fill="#A5B4FC" font-size="18" font-weight="700" text-anchor="middle">tối ưu</text>
    <!-- mũi tên giảm -->
    <path d="M150 70 L150 130 L235 130 L235 250" stroke="#818CF8" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
</svg>
