  <text x="80" y="268" fill="#94A3B8" font-size="25" font-weight="500">Vì sao bình quân các tỉ lệ là một cái bẫy —</text>
  <text x="80" y="302" fill="#94A3B8" font-size="25" font-weight="500">và nhóm to luôn kéo con số về phía nó</text>
  <g transform="translate(600,470)">
