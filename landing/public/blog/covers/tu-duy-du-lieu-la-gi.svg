<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgkt018" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrkt018" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#4ADE80"/>
    </marker>
    <marker id="arrgkt018" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgkt018)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">KIẾN THỨC NỀN TẢNG</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Tư duy dựa trên dữ liệu</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="28" font-weight="600">Dám để một con số đổi ý mình</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: brain (intuition) sets a course; a number bends the decision arrow -->
  <g transform="translate(760,150)">
    <!-- brain / intuition chip -->
    <rect x="0" y="86" width="150" height="88" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="75" y="124" fill="#E2E8F0" font-size="30" text-anchor="middle">🧠</text>
    <text x="75" y="156" fill="#94A3B8" font-size="15" text-anchor="middle">Cảm tính</text>
    <!-- the gut path: straight, faded -->
    <path d="M156 130 L300 130" stroke="#64748B" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#arrgkt018)"/>
    <!-- the data point that bends the path -->
    <circle cx="240" cy="46" r="34" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="240" y="42" fill="#4ADE80" font-size="20" font-weight="800" text-anchor="middle">31%</text>
    <text x="240" y="61" fill="#94A3B8" font-size="11" text-anchor="middle">1 con số</text>
    <path d="M240 80 L240 116" stroke="#4ADE80" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <!-- the data-informed path: bent upward toward a better decision -->
    <path d="M156 130 C235 130 235 60 320 50" stroke="#4ADE80" stroke-width="3.5" fill="none" marker-end="url(#arrkt018)"/>
    <!-- the decision box -->
    <rect x="338" y="14" width="172" height="80" rx="14" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <text x="424" y="48" fill="#C7D2FE" font-size="19" font-weight="700" text-anchor="middle">Đổi ý</text>
    <text x="424" y="74" fill="#94A3B8" font-size="15" text-anchor="middle">→ quyết định</text>
    <!-- mini bars under decision -->
    <g transform="translate(350,118)">
      <rect x="0" y="22" width="14" height="18" rx="2" fill="#475569"/>
      <rect x="22" y="12" width="14" height="28" rx="2" fill="#64748B"/>
      <rect x="44" y="0" width="14" height="40" rx="2" fill="#818CF8"/>
      <rect x="66" y="16" width="14" height="24" rx="2" fill="#64748B"/>
      <rect x="88" y="8" width="14" height="32" rx="2" fill="#7DD3FC"/>
      <rect x="110" y="20" width="14" height="20" rx="2" fill="#475569"/>
      <rect x="132" y="6" width="14" height="34" rx="2" fill="#4ADE80"/>
    </g>
  </g>
</svg>
