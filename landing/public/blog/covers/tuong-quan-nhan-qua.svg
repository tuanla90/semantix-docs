<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt023" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt023)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Tương quan ≠ nhân quả</text>
  <text x="80" y="296" fill="#CBD5E1" font-size="29" font-weight="600">Hai số cùng tăng không có nghĩa là nhân quả</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: two rising lines, a not-equals sign, a hidden third factor behind -->
  <g transform="translate(720,150)">
    <!-- hidden confounder behind -->
    <circle cx="240" cy="150" r="92" fill="#1E293B" stroke="#334155" stroke-width="2" opacity="0.7"/>
    <text x="240" y="140" fill="#64748B" font-size="18" text-anchor="middle">yếu tố</text>
    <text x="240" y="166" fill="#64748B" font-size="18" text-anchor="middle">thứ ba</text>
    <path d="M240 58 C150 30 110 60 95 96" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <path d="M240 58 C330 30 370 60 385 96" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <!-- left rising line: tương quan -->
    <rect x="20" y="96" width="150" height="120" rx="12" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <polyline points="38,196 70,176 102,182 152,118" fill="none" stroke="#818CF8" stroke-width="3"/>
    <polyline points="38,204 70,184 102,190 152,126" fill="none" stroke="#7DD3FC" stroke-width="3"/>
    <text x="95" y="246" fill="#818CF8" font-size="18" font-weight="700" text-anchor="middle">tương quan</text>
    <!-- not-equals sign -->
    <text x="240" y="318" fill="#F59E0B" font-size="58" font-weight="800" text-anchor="middle">&#8800;</text>
    <!-- right rising line: nhân quả -->
    <rect x="310" y="96" width="150" height="120" rx="12" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <line x1="338" y1="196" x2="442" y2="126" stroke="#4ADE80" stroke-width="3"/>
    <path d="M430 122 L448 122 L444 140 Z" fill="#4ADE80"/>
    <text x="385" y="246" fill="#4ADE80" font-size="18" font-weight="700" text-anchor="middle">nhân quả</text>
  </g>
</svg>
