<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgHd017" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="clearHd017" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="blurHd017" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <marker id="arHd017" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgHd017)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">Viết câu hỏi cho AI</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Câu hỏi mơ hồ → câu hỏi rõ → số đúng</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: vague (blurry) -> clear -> correct result -->
  <g transform="translate(700,360)">
    <!-- vague question bubble (blurred) -->
    <g filter="url(#blurHd017)" opacity="0.7">
      <rect x="0" y="0" width="150" height="84" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <text x="75" y="38" fill="#94A3B8" font-size="17" text-anchor="middle">"tháng này?"</text>
      <text x="75" y="62" fill="#64748B" font-size="15" text-anchor="middle">mơ hồ</text>
    </g>
    <!-- arrow 1 -->
    <path d="M156 42 L196 42" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arHd017)"/>
    <!-- clear question bubble (sharp) -->
    <rect x="208" y="0" width="170" height="84" rx="14" fill="#0B1220" stroke="url(#clearHd017)" stroke-width="2.5"/>
    <text x="293" y="34" fill="#C7D2FE" font-size="16" text-anchor="middle">"T6/2025, Shopee,</text>
    <text x="293" y="56" fill="#C7D2FE" font-size="16" text-anchor="middle">khách mới, top 10"</text>
    <text x="293" y="76" fill="#818CF8" font-size="13" text-anchor="middle" font-weight="700">rõ ràng</text>
    <!-- arrow 2 -->
    <path d="M384 42 L424 42" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#arHd017)"/>
    <!-- correct result -->
    <rect x="436" y="0" width="64" height="84" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <path d="M452 42 l8 9 l16 -19" stroke="#4ADE80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="74" fill="#4ADE80" font-size="13" text-anchor="middle" font-weight="700">đúng</text>
  </g>
</svg>
