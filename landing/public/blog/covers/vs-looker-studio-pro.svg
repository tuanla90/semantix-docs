<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <text x="80" y="92" fill="#22D3EE" font-size="20" font-weight="700" letter-spacing="3">SO SÁNH &amp; LỰA CHỌN</text>
  <text x="80" y="160" fill="#F1F5F9" font-size="46" font-weight="800">Looker Studio Pro vs Semantix</text>
  <text x="80" y="210" fill="#94A3B8" font-size="25" font-weight="500">Trả tiền cho Pro được thêm gì —</text>
  <text x="80" y="244" fill="#94A3B8" font-size="25" font-weight="500">và Semantix có sẵn không?</text>
  <!-- LEFT: PRO badge + per-user pricing -->
  <g transform="translate(80,300)">
    <rect x="0" y="0" width="460" height="230" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <text x="24" y="36" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">LOOKER PRO — PER-USER × PROJECT</text>
    <rect x="24" y="56" width="120" height="44" rx="22" fill="url(#pro)"/>
    <text x="84" y="85" fill="#0B1120" font-size="22" font-weight="800" text-anchor="middle">PRO</text>
    <text x="160" y="74" fill="#FBBF24" font-size="20" font-weight="700">~9 USD</text>
    <text x="160" y="96" fill="#94A3B8" font-size="14">/người /project /tháng</text>
    <g transform="translate(24,128)">
      <rect x="0" y="48" width="38" height="32" fill="#F59E0B"/>
      <rect x="50" y="30" width="38" height="50" fill="#F59E0B"/>
      <rect x="100" y="12" width="38" height="68" fill="#F59E0B"/>
      <rect x="150" y="-8" width="38" height="88" fill="#F59E0B"/>
      <line x1="0" y1="80" x2="280" y2="80" stroke="#334155" stroke-width="1.5"/>
      <text x="210" y="20" fill="#FCA5A5" font-size="14" font-weight="700">đông → nhân lên</text>
    </g>
  </g>
  <!-- VS badge -->
  <g transform="translate(600,415)">
    <circle r="34" fill="#0B1120" stroke="#22D3EE" stroke-width="2"/>
    <text x="0" y="11" fill="#22D3EE" font-size="26" font-weight="800" text-anchor="middle">vs</text>
  </g>
  <!-- RIGHT: flat workspace pricing -->
  <g transform="translate(660,300)">
    <rect x="0" y="0" width="460" height="230" rx="14" fill="#0F172A" stroke="#164E45" stroke-width="2"/>
    <text x="24" y="36" fill="#34D399" font-size="15" font-weight="700" letter-spacing="1">SEMANTIX — PHẲNG / WORKSPACE</text>
    <text x="24" y="86" fill="#86EFAC" font-size="30" font-weight="800">1.290.000đ</text>
    <text x="24" y="112" fill="#94A3B8" font-size="14">/tháng • ~15 người • không tính đầu người</text>
    <g transform="translate(24,128)">
      <rect x="0" y="40" width="38" height="40" rx="3" fill="url(#flat)"/>
      <rect x="50" y="40" width="38" height="40" rx="3" fill="url(#flat)"/>
      <rect x="100" y="40" width="38" height="40" rx="3" fill="url(#flat)"/>
      <rect x="150" y="40" width="38" height="40" rx="3" fill="url(#flat)"/>
      <line x1="0" y1="80" x2="280" y2="80" stroke="#334155" stroke-width="1.5"/>
      <text x="210" y="30" fill="#34D399" font-size="14" font-weight="700">đông → vẫn phẳng</text>
    </g>
  </g>
  <text x="80" y="568" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
</svg>
