<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpt051" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="apt051" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bgpt051)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">PHÂN TÍCH DỮ LIỆU</text>
  <text x="80" y="232" fill="#ffffff" font-size="54" font-weight="800">WHY Analysis</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Vì sao con số đổi? Bóc ra &amp; tìm gốc</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX • BLOG</text>
  <!-- motif: one big number splits into waterfall contribution columns -->
  <g transform="translate(720,150)">
    <!-- the big total -->
    <rect x="0" y="60" width="120" height="120" rx="14" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="60" y="112" fill="#4ADE80" font-size="34" font-weight="800" text-anchor="middle">−15%</text>
    <text x="60" y="142" fill="#94A3B8" font-size="15" text-anchor="middle">doanh thu</text>
    <!-- split arrow -->
    <path d="M126 120 L196 120" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#apt051)"/>
    <!-- waterfall bars: baseline y=240, total left, minus, minus, plus, total right -->
    <g transform="translate(210,0)">
      <line x1="0" y1="240" x2="290" y2="240" stroke="#334155" stroke-width="1.5"/>
      <!-- start total -->
      <rect x="6" y="70" width="40" height="170" rx="3" fill="#475569"/>
      <!-- minus gia -->
      <rect x="60" y="70" width="40" height="44" rx="3" fill="#F87171"/>
      <!-- minus khach -->
      <rect x="114" y="114" width="40" height="30" rx="3" fill="#F87171"/>
      <!-- plus don TB -->
      <rect x="168" y="125" width="40" height="19" rx="3" fill="#4ADE80"/>
      <!-- end total -->
      <rect x="222" y="125" width="40" height="115" rx="3" fill="#818CF8"/>
      <!-- connectors -->
      <line x1="46" y1="70" x2="60" y2="70" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="100" y1="114" x2="114" y2="114" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="154" y1="144" x2="168" y2="144" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="208" y1="125" x2="222" y2="125" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="26" y="262" fill="#94A3B8" font-size="13" text-anchor="middle">trước</text>
      <text x="80" y="262" fill="#FCA5A5" font-size="13" text-anchor="middle">giá</text>
      <text x="134" y="262" fill="#FCA5A5" font-size="13" text-anchor="middle">khách</text>
      <text x="188" y="262" fill="#86EFAC" font-size="13" text-anchor="middle">đơn TB</text>
      <text x="242" y="262" fill="#A5B4FC" font-size="13" text-anchor="middle">sau</text>
    </g>
  </g>
</svg>
