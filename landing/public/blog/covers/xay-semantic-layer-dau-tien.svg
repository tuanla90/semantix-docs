<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bghd018" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="ahd018" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bghd018)"/>
  <g stroke="#312E81" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="140" fill="#818CF8" font-size="22" font-weight="700" letter-spacing="3">HƯỚNG DẪN THỰC CHIẾN</text>
  <text x="80" y="232" fill="#ffffff" font-size="52" font-weight="800">Định nghĩa &quot;doanh thu&quot; chuẩn</text>
  <text x="80" y="298" fill="#CBD5E1" font-size="30" font-weight="600">Ba con số &#8594; một định nghĩa &#8594; một số</text>
  <text x="80" y="520" fill="#64748B" font-size="20" font-weight="700" letter-spacing="2">SEMANTIX &#8226; BLOG</text>
  <!-- motif: three conflicting revenue numbers converge into one shared definition, then one number -->
  <g transform="translate(700,277) scale(0.988)">
    <!-- three conflicting source numbers -->
    <rect x="0" y="0" width="170" height="50" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="16" y="31" fill="#94A3B8" font-size="15">Sales</text>
    <text x="158" y="31" fill="#F87171" font-size="20" font-weight="700" text-anchor="end">4,2 tỷ</text>
    <rect x="0" y="70" width="170" height="50" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="16" y="101" fill="#94A3B8" font-size="15">Finance</text>
    <text x="158" y="101" fill="#FBBF24" font-size="20" font-weight="700" text-anchor="end">3,8 tỷ</text>
    <rect x="0" y="140" width="170" height="50" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="16" y="171" fill="#94A3B8" font-size="15">Data</text>
    <text x="158" y="171" fill="#7DD3FC" font-size="20" font-weight="700" text-anchor="end">4,05 tỷ</text>
    <!-- arrows into the shared definition -->
    <path d="M176 25 C220 25 220 90 262 95" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ahd018)"/>
    <path d="M176 95 L262 95" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ahd018)"/>
    <path d="M176 165 C220 165 220 100 262 95" stroke="#818CF8" stroke-width="3" fill="none" marker-end="url(#ahd018)"/>
    <!-- shared definition box -->
    <rect x="280" y="56" width="180" height="78" rx="12" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <text x="370" y="88" fill="#C7D2FE" font-size="16" font-weight="700" text-anchor="middle">1 định nghĩa</text>
    <text x="370" y="112" fill="#64748B" font-size="13" text-anchor="middle">đã giao &#8722; hoàn/hủy</text>
    <!-- arrow to single number -->
    <path d="M466 95 L514 95" stroke="#4ADE80" stroke-width="3" fill="none" marker-end="url(#ahd018)"/>
    <!-- the one final number -->
    <rect x="320" y="170" width="180" height="62" rx="12" fill="#0B1220" stroke="#4ADE80" stroke-width="2"/>
    <text x="410" y="209" fill="#4ADE80" font-size="26" font-weight="800" text-anchor="middle">3,95 tỷ</text>
  </g>
</svg>
